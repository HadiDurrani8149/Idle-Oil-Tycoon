<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#3B2417">
<title>CRUDE: Playable 3.4</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Barlow+Condensed:wght@600;700&family=Luckiest+Guy&display=swap" rel="stylesheet">
<style>
:root{
  --sky:#F9C46B;--horizon:#EF7D3C;--sand:#E3B778;--sandsh:#B3814B;--bit:#1A120E;--panel:#3B2417;--panel2:#4B2F1E;
  --brass:#F2B233;--brassd:#A8701A;--teal:#2FA39B;--alarm:#E04B2F;--cream:#FFF3DC;--dim:#E9CFA5;
  --backdrop:#2A1A10;--ph:262px;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--backdrop:#140C07}}
:root[data-theme="dark"]{--backdrop:#140C07}
html{height:100%;background:linear-gradient(to bottom,#F9C46B 0 50%,#2E1B10 50% 100%);scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;height:100%;background:var(--backdrop);display:flex;align-items:center;justify-content:center;overflow:hidden;
  font-family:'Barlow Condensed',system-ui,sans-serif;font-weight:600;color:var(--cream);
  -webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;touch-action:manipulation}
button{font:inherit;color:inherit;-webkit-tap-highlight-color:transparent}
#app{position:relative;width:100%;max-width:430px;height:100%;height:100dvh;max-height:940px;overflow:hidden;background:#EF7D3C}
@media (min-width:520px) and (min-height:600px){#app{border-radius:30px;border:4px solid var(--bit);box-shadow:0 10px 0 rgba(0,0,0,.45);height:calc(100% - 24px)}}
canvas#world{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
canvas#fx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:9}

/* outline + hard shadow for any text over 16px */
.olk{text-shadow:-2px -2px 0 var(--bit),2px -2px 0 var(--bit),-2px 2px 0 var(--bit),2px 2px 0 var(--bit),0 -2.5px 0 var(--bit),0 2.5px 0 var(--bit),-2.5px 0 0 var(--bit),2.5px 0 0 var(--bit),2px 4px 0 var(--bit)}

/* panel construction: drop shadow, body, brass frame inset 2px, gloss band */
.pnl{position:relative;background:var(--panel);border:3px solid var(--bit);border-radius:14px;
  box-shadow:0 4px 0 var(--bit),inset 0 0 0 2px var(--panel),inset 0 0 0 5px var(--brass),inset 0 0 0 7px rgba(0,0,0,.28)}
.pnl::before{content:"";position:absolute;left:5px;right:5px;top:5px;height:30%;border-radius:9px 9px 50% 50%/9px 9px 14px 14px;
  background:linear-gradient(rgba(255,255,255,.15),rgba(255,255,255,0));pointer-events:none}
.riv::after{content:"";position:absolute;inset:9px;pointer-events:none;
  background:radial-gradient(circle,#FFE3A0 0 1.4px,#A8701A 1.9px 3.2px,var(--bit) 3.3px 4px,transparent 4.2px) top left/9px 9px no-repeat,
  radial-gradient(circle,#FFE3A0 0 1.4px,#A8701A 1.9px 3.2px,var(--bit) 3.3px 4px,transparent 4.2px) top right/9px 9px no-repeat,
  radial-gradient(circle,#FFE3A0 0 1.4px,#A8701A 1.9px 3.2px,var(--bit) 3.3px 4px,transparent 4.2px) bottom left/9px 9px no-repeat,
  radial-gradient(circle,#FFE3A0 0 1.4px,#A8701A 1.9px 3.2px,var(--bit) 3.3px 4px,transparent 4.2px) bottom right/9px 9px no-repeat}

/* coin */
.coin{display:inline-block;flex:0 0 auto;width:22px;height:22px;border-radius:50%;border:2.5px solid var(--bit);position:relative;
  background:radial-gradient(circle at 35% 30%,#FFF4C0 0 16%,#F7C63F 38%,#D8951F 100%);box-shadow:inset 0 -2px 0 rgba(0,0,0,.25)}
.coin::after{content:"";position:absolute;inset:3px;border-radius:50%;border:2px solid rgba(168,112,26,.8)}
.coin.big{width:38px;height:38px;border-width:3px}
.coin.big::after{inset:5px;border-width:2.5px}
.coin.sm{width:18px;height:18px;border-width:2px}
.coin.sm::after{inset:2.5px;border-width:1.5px}
.coin.bump{animation:cbump .22s ease-out}
@keyframes cbump{40%{transform:scale(1.28) rotate(-8deg)}100%{transform:none}}

/* HUD */
#hud{position:absolute;left:0;right:0;top:0;padding:10px 12px 0;z-index:3;pointer-events:none;display:flex;flex-direction:column;align-items:center;gap:9px}
.cash{display:flex;align-items:center;gap:9px;padding:7px 18px 8px 10px;min-width:196px}
.cashcol{display:flex;flex-direction:column;line-height:1}
.num{font-family:'Archivo Black',sans-serif;font-size:27px;color:var(--cream);letter-spacing:.5px;font-variant-numeric:tabular-nums}
.rate{font-size:14px;color:var(--dim);margin-top:4px}
.bneck{pointer-events:auto;display:inline-flex;align-items:center;gap:7px;border:3px solid var(--bit);border-radius:999px;padding:3px 13px 3px 9px;
  background:rgba(26,18,14,.86);box-shadow:0 3px 0 var(--bit);cursor:pointer;transform:rotate(-1.5deg)}
.goal{pointer-events:auto;display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:3px 10px;max-width:94%;border:3px solid var(--bit);border-radius:14px;padding:4px 12px 5px;
  background:rgba(26,18,14,.86);box-shadow:0 3px 0 var(--bit);color:#E9CFA5;font-size:13.5px;font-weight:700;transform:rotate(-1deg);cursor:pointer}
.goal b{font-family:'Luckiest Guy',sans-serif;font-weight:400;font-size:15px;color:var(--brass);width:100%;text-align:center;padding-top:2px}
.goal span.ok{color:#9FE3D9}
.goal.ready{background:var(--teal);color:#fff;animation:breathe 1.4s ease-in-out infinite}.goal.ready b{color:#fff}
.bneck .dot{width:11px;height:11px;border-radius:50%;background:var(--alarm);border:2px solid #000;animation:pulse 1s ease-in-out infinite}
.bneck .bl{font-size:14px;color:#F4D9A6;font-weight:700}
.bneck .bn{font-family:'Luckiest Guy',sans-serif;font-size:19px;letter-spacing:.5px;padding-top:3px}
.bneck .bnr{font-family:'Archivo Black',sans-serif;font-size:12px;color:var(--dim)}
@keyframes pulse{50%{transform:scale(1.3);box-shadow:0 0 0 4px rgba(224,75,47,.35)}}
@keyframes bob{50%{transform:translateY(-3px) rotate(var(--r,0deg))}}

/* bottom panel */
#panel{position:absolute;left:8px;right:8px;bottom:82px;height:var(--ph);z-index:3;padding:25px 10px 10px;display:flex;flex-direction:column;--stc:var(--brass)}
#panel.in{animation:pin .38s cubic-bezier(.2,1.4,.4,1)}
@keyframes pin{0%{transform:translateY(46px) scale(.96);opacity:.3}60%{transform:translateY(-4px) scale(1.01)}100%{transform:none;opacity:1}}
.ribbon{position:absolute;top:-16px;left:12px;transform:rotate(-4deg);padding:4px 16px 1px;font-family:'Luckiest Guy',sans-serif;font-size:21px;letter-spacing:.5px;
  color:#FFF7E6;border:3px solid var(--bit);border-radius:9px;box-shadow:0 3px 0 var(--bit),inset 0 2px 0 rgba(255,255,255,.35);background:var(--stc);z-index:2}
.pstat{position:absolute;top:-13px;right:12px;display:flex;gap:6px;align-items:center;z-index:2}
.chip{background:var(--bit);color:var(--cream);font-family:'Archivo Black',sans-serif;font-size:12.5px;padding:3px 9px;border-radius:8px;border:2px solid var(--brass);white-space:nowrap}
.stk{background:var(--alarm);color:#fff;font-family:'Luckiest Guy',sans-serif;font-size:14px;padding:3px 8px 0;border:2.5px solid var(--bit);border-radius:7px;
  --r:6deg;transform:rotate(6deg);box-shadow:0 2px 0 var(--bit);animation:bob 1s ease-in-out infinite;white-space:nowrap}
.rows{display:flex;flex-direction:column;gap:7px;flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;margin:0 -4px;padding:2px 4px 8px;scrollbar-width:none;
  -webkit-mask-image:linear-gradient(#000 calc(100% - 16px),transparent);mask-image:linear-gradient(#000 calc(100% - 16px),transparent)}
.rows::-webkit-scrollbar{display:none}
.rows>.row,.rows>.icard{flex:0 0 66px;min-height:66px}
.seg{position:sticky;top:-2px;z-index:3;box-shadow:0 4px 0 var(--panel);flex:0 0 auto;display:flex;gap:4px;background:var(--bit);border-radius:11px;padding:3px;border:2px solid var(--bit);align-self:flex-start}
.seg button{border:0;background:transparent;color:#C9AE86;font-family:'Luckiest Guy',sans-serif;font-size:14px;padding:6px 14px 3px;border-radius:8px;cursor:pointer;letter-spacing:.3px;min-height:30px}
.seg button.on{background:var(--brass);color:var(--bit);box-shadow:inset 0 -3px 0 var(--brassd)}
.bcard{flex:0 0 auto;position:relative;background:var(--panel2);border:2.5px solid var(--bit);border-radius:12px;padding:6px 9px 7px;box-shadow:inset 0 2px 0 rgba(255,255,255,.08),inset 0 -3px 0 rgba(0,0,0,.25)}
.bhead{display:flex;align-items:center;gap:6px}
.bdot{flex:0 0 22px;height:22px;border-radius:7px;border:2.5px solid var(--bit);background:var(--tint);color:var(--bit);font-family:'Archivo Black',sans-serif;font-size:11px;display:flex;align-items:center;justify-content:center}
.bname{font-family:'Luckiest Guy',sans-serif;font-size:16.5px;padding-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:1}
.bchip{font-family:'Archivo Black',sans-serif;font-size:10.5px;background:var(--bit);color:#FFE08A;border-radius:6px;padding:2px 5px;white-space:nowrap}
.bchip.g{color:#9FE3D9}
.bprice{font-family:'Archivo Black',sans-serif;font-size:11px;color:var(--cream);white-space:nowrap;min-width:0}
.bbody{display:flex;align-items:center;gap:8px;margin-top:6px}
.bmeter{position:relative;flex:0 0 36%;height:12px;border-radius:7px;background:#C99A60;border:2px solid var(--bit);overflow:hidden}
.bmeter i{position:absolute;left:0;top:0;bottom:0;background:var(--bit);box-shadow:inset 0 2px 0 rgba(255,255,255,.3)}
.bmeter em{position:absolute;right:0;top:0;bottom:0;background:var(--alarm)}
.bcard.sat .bprice{color:#FF9B85}
.bpct{flex:0 0 34px;text-align:right;font-family:'Archivo Black',sans-serif;font-size:11px;color:var(--dim)}
.bslide{flex:1;-webkit-appearance:none;appearance:none;height:26px;background:transparent;margin:0}
.bslide::-webkit-slider-runnable-track{height:10px;border-radius:6px;background:var(--bit);border:2px solid var(--bit)}
.bslide::-moz-range-track{height:10px;border-radius:6px;background:var(--bit);border:2px solid var(--bit)}
.bslide::-webkit-slider-thumb{-webkit-appearance:none;width:24px;height:24px;margin-top:-9px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#FFE9A8,var(--brass) 55%,var(--brassd));border:3px solid var(--bit);box-shadow:0 2px 0 var(--bit)}
.bslide::-moz-range-thumb{width:20px;height:20px;border-radius:50%;background:var(--brass);border:3px solid var(--bit)}
.block{display:none;font-size:13px;color:#C9AE86;margin-top:3px}
.bcard.locked{opacity:.72}.bcard.locked .bbody{display:none}.bcard.locked .block{display:block}
.pstrip{flex:0 0 auto;display:grid;grid-template-columns:1fr auto;grid-template-rows:auto auto;gap:4px 8px;background:#1F3531;border:2.5px solid var(--bit);border-radius:12px;padding:6px 8px;box-shadow:inset 0 0 0 2px rgba(92,205,195,.25)}
.pstrip canvas{grid-column:1/2;grid-row:1/3;width:100%;height:58px;display:block}
.pinfo{display:flex;flex-direction:column;align-items:flex-end;line-height:1.1}
.pinfo b{font-family:'Archivo Black',sans-serif;font-size:18px;color:#FFF3DC}
.pinfo span{font-size:12.5px;max-width:120px;text-align:right}.pinfo .up{color:#9FE3D9}.pinfo .dn{color:#FFB199}
.hold{display:flex;gap:5px}.hold .btn .face{min-height:32px;padding:2px 8px}.hold .btn .pr,.hold .btn .lbl{font-size:14px}
.hold .btn.on .face{background:linear-gradient(#FFD874,var(--brass))}.hold .btn.on .lbl{color:var(--bit)}
.gmeter{position:relative;height:14px;border-radius:7px;background:var(--bit);border:2px solid var(--bit);margin-top:4px;overflow:hidden}
.gmeter i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,#8A6A3E,#9FE3D9);transition:width .4s}
.gmeter s{position:absolute;top:0;bottom:0;right:0;background:repeating-linear-gradient(45deg,#3B2417 0 4px,#1A120E 4px 8px);border-left:2px solid var(--brass)}
.gmeter u{position:absolute;top:0;bottom:0;width:2px;background:rgba(255,243,220,.55)}
.row.crew.hired{opacity:.85}.buy.done .lip{background:#1C6B65}.buy.done .face{background:linear-gradient(#5CCDC3,var(--teal))}.buy.done .coin{display:none}
.devrow{flex:0 0 auto;display:flex;flex-wrap:wrap;gap:5px;align-items:center;font-size:12.5px;color:#C9AE86}
.devrow span{flex:0 0 auto;margin-right:2px}
.dev{border:2px solid var(--bit);background:#5C3A24;color:var(--cream);border-radius:8px;font-size:12.5px;font-weight:700;padding:4px 7px;cursor:pointer;box-shadow:0 2px 0 var(--bit)}
#event{position:absolute;left:50%;top:0;z-index:3;transform:translate(-50%,-80px) rotate(-1.5deg);transition:transform .35s cubic-bezier(.2,1.4,.4,1);pointer-events:none;
  background:var(--alarm);border:3px solid var(--bit);border-radius:12px;padding:4px 12px 6px;box-shadow:0 3px 0 var(--bit);min-width:220px;max-width:94%;white-space:nowrap}
#event.on{transform:translate(-50%,calc(var(--hb,120px) + 6px)) rotate(-1.5deg)}
#event .row1{display:flex;align-items:center;gap:8px;justify-content:space-between}
#evtxt{font-family:'Luckiest Guy',sans-serif;font-size:15px;color:#fff;padding-top:3px;white-space:nowrap}
#evtime{font-family:'Archivo Black',sans-serif;font-size:12px;color:#fff}
#event .evb{height:5px;background:rgba(26,18,14,.5);border-radius:3px;margin-top:3px;overflow:hidden}#evbar{display:block;height:100%;background:#FFE08A}
.land{display:flex;gap:12px;align-items:center;background:var(--panel2);border:2.5px solid var(--bit);border-radius:12px;padding:10px;box-shadow:inset 0 2px 0 rgba(255,255,255,.08)}
.land .ic{width:62px;height:58px;flex:0 0 62px}.land .ic svg{width:46px;height:46px}.land .val{font-size:15px;line-height:1.25;margin-top:4px}
.landbtn{flex:0 0 auto;margin-top:6px}.landbtn .face{min-height:52px;gap:8px}.landbtn .lbl{font-family:'Luckiest Guy',sans-serif;font-size:20px;color:#FFF9EA;padding-top:3px}
.stk.nw{background:var(--teal)}
.bd.nw{display:flex;background:var(--teal);color:#fff;width:auto;padding:0 5px;border-radius:8px;animation:bob 1s ease-in-out infinite;font-size:9.5px}.bd.nw::before{content:"NEW"}
.tab.newtab{animation:tabin .6s cubic-bezier(.2,1.6,.4,1)}@keyframes tabin{0%{transform:scale(.2) translateY(30px);opacity:0}100%{transform:none;opacity:1}}
.bcard.noslide .bslide,.bcard.noslide .bpct{display:none}.bcard.noslide .bmeter{flex:1}
.kmini{display:inline-block;width:22px;height:22px;border-radius:50%;overflow:hidden;border:2px solid var(--bit);vertical-align:-5px;margin-right:6px}.kmini svg{width:100%;height:100%}
.ktarget{flex:0 0 auto!important;min-height:0!important;padding:7px 9px}.kpor{flex:0 0 46px;height:46px;border-radius:10px;overflow:hidden;border:2.5px solid var(--bit)}.kpor svg{width:100%;height:100%}
.ktarget .nm{white-space:normal;font-size:15.5px;line-height:1.15}
.ktarget .val span{display:inline-block;margin-right:8px}.ktarget .val span.ok{color:#9FE3D9}
.wcard .btn,.gascard .btn{flex:0 0 96px}
.rows>.icard.wcard{flex:0 0 auto;min-height:66px;padding-top:6px;padding-bottom:7px}
.wcard .pull{margin-top:5px;padding:3px 9px;font-size:12.5px}.wcard.thin .wtxt{color:#FF9B85}
.routecard{flex:0 0 auto!important;min-height:0!important;padding:8px 10px}.routecard .val{font-size:14.5px}
#auction{position:absolute;inset:0;z-index:12;display:flex;align-items:center;justify-content:center;background:rgba(26,18,14,.62);opacity:0;pointer-events:none;transition:opacity .25s}
#auction.on{opacity:1;pointer-events:auto}
#auction .ac{width:90%;max-width:360px;padding:26px 14px 14px;transform:scale(.8);transition:transform .4s cubic-bezier(.2,1.6,.4,1)}#auction.on .ac{transform:none}
#auction .ribbon{left:50%;transform:translateX(-50%) rotate(-3deg);white-space:nowrap;background:var(--brass)}
.aside{display:flex;justify-content:space-between;gap:10px;margin:6px 0 10px}.aside>div{flex:1;text-align:center;border:3px solid var(--bit);border-radius:12px;padding:8px 4px;background:var(--panel2);transition:transform .2s}
.aside>div.lead{border-color:var(--brass);transform:translateY(-4px);box-shadow:0 0 0 3px rgba(242,178,51,.35)}.aside .ap{width:58px;height:58px;margin:0 auto 4px;border-radius:12px;overflow:hidden;border:3px solid var(--bit)}.aside .ap svg{width:100%;height:100%}
.aside b{font-family:'Luckiest Guy',sans-serif;font-size:15px;color:var(--cream)}
#aBid{font-family:'Archivo Black',sans-serif;font-size:30px;text-align:center;color:#FFE08A}#aMsg{text-align:center;font-size:15px;color:var(--dim);min-height:20px}
.abar{height:8px;border-radius:5px;background:var(--bit);overflow:hidden;margin:8px 0 12px}#aBar{display:block;height:100%;background:var(--alarm);transition:width .1s linear}
.abtns{display:flex;gap:8px}.abtns .btn{flex:1}
#gear{position:absolute;top:12px;right:10px;z-index:11;width:44px;height:44px;border-radius:13px;border:3px solid var(--bit);background:var(--panel);box-shadow:0 3px 0 var(--bit),inset 0 0 0 2px var(--panel),inset 0 0 0 4px rgba(242,178,51,.6);display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0}
#gear svg{width:30px;height:30px;transition:transform .4s}#gear:active svg{transform:rotate(60deg)}
#settings{position:absolute;inset:0;z-index:13;display:flex;align-items:center;justify-content:center;background:rgba(26,18,14,.62);opacity:0;pointer-events:none;transition:opacity .2s}
#settings.on{opacity:1;pointer-events:auto}
#settings .sc{width:84%;max-width:330px;padding:30px 16px 16px;transform:scale(.85);transition:transform .35s cubic-bezier(.2,1.6,.4,1)}#settings.on .sc{transform:none}
#settings .ribbon{left:50%;transform:translateX(-50%) rotate(-3deg);background:var(--teal)}
#setMain{display:flex;flex-direction:column;gap:10px}#setMain .btn,.abtns .btn{width:100%}
.btn.danger .lip{background:#8E2A1A}.btn.danger .face{background:linear-gradient(#F07A5E,var(--alarm) 55%,#C23A22)}.btn.danger .lbl{font-family:'Luckiest Guy',sans-serif;font-size:18px;color:#fff;padding-top:3px}
.sq{font-family:'Luckiest Guy',sans-serif;font-size:26px;color:var(--cream);text-align:center}.sd{font-size:15.5px;line-height:1.3;color:var(--dim);text-align:center;margin:8px 0 14px}
/* Yara's casual lines: a compact bubble that never blocks */
#card.bubble{left:auto;right:10px;max-width:78%;padding:6px 10px 7px 6px;gap:8px;pointer-events:none}
#card.bubble .por{flex:0 0 40px;width:40px;height:40px;border-radius:10px}#card.bubble .who{font-size:13px}#card.bubble .txt{font-size:14.5px}#card.bubble .more{display:none}
.row .newtag{position:absolute;top:-9px;left:74px;display:none;background:var(--teal);color:#fff;border:2.5px solid var(--bit);border-radius:7px;font-family:'Luckiest Guy',sans-serif;font-size:12px;padding:1px 6px 0;transform:rotate(-6deg);box-shadow:0 2px 0 var(--bit);animation:bob 1.2s ease-in-out infinite}
.row.isnew .newtag{display:block}.row.isnew{box-shadow:0 0 0 3px rgba(92,205,195,.55),inset 0 2px 0 rgba(255,255,255,.08)}
.chip-hire{flex:0 0 auto;display:flex;align-items:center;gap:8px;border:2.5px solid var(--bit);border-radius:12px;background:#1F3531;color:var(--cream);padding:6px 10px;cursor:pointer;text-align:left;box-shadow:0 3px 0 var(--bit);font:inherit}
.chip-hire i{flex:0 0 28px;height:28px;border-radius:8px;background:var(--brass);border:2px solid var(--bit);display:flex;align-items:center;justify-content:center}.chip-hire i svg{width:22px;height:22px}
.chip-hire span{flex:1;font-size:14px;line-height:1.2}.chip-hire span b{display:block;color:#9FE3D9;font-weight:700}.chip-hire em{font-style:normal;font-family:'Archivo Black',sans-serif;font-size:13px;color:#FFE08A}
.autoline{flex:0 0 auto;font-size:14px;color:#9FE3D9;padding:4px 6px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}.pstrip .autoline{grid-column:1/3;padding:0}
.hold .gasbtn .face{background:linear-gradient(#DDF1F8,#BFE3F2 55%,#8CC6DA)}.hold .gasbtn .lip{background:#4C8A9E}.hold .gasbtn .lbl{color:var(--bit)}
#offer{position:absolute;left:10px;right:10px;bottom:calc(92px + var(--ph));z-index:7;display:flex;align-items:center;gap:10px;padding:8px 10px;transform:translateY(40px);opacity:0;pointer-events:none;transition:transform .35s cubic-bezier(.2,1.4,.4,1),opacity .2s}
#offer.on{transform:none;opacity:1;pointer-events:auto}#offer>i{flex:0 0 40px;height:40px;border-radius:10px;background:var(--brass);border:2.5px solid var(--bit);display:flex;align-items:center;justify-content:center}#offer>i svg{width:30px;height:30px}
#offer>div{flex:1;min-width:0;line-height:1.2}#offer b{display:block;font-family:'Luckiest Guy',sans-serif;font-size:16px;color:var(--brass)}#offer span{font-size:14px;color:var(--cream)}
#offer .btn{flex:0 0 auto}#offer .btn .face{min-height:36px;padding:2px 10px}#offer .btn .pr{font-size:15px}.oX{flex:0 0 28px;height:28px;border-radius:50%;border:2px solid var(--bit);background:#5C3A24;color:var(--cream);font-weight:700;cursor:pointer}
#cele{position:absolute;inset:0;z-index:12;display:flex;align-items:center;justify-content:center;background:rgba(26,18,14,.6);opacity:0;pointer-events:none;transition:opacity .25s}
#cele.on{opacity:1;pointer-events:auto}
#cele .cc{width:82%;max-width:330px;text-align:center;padding:22px 18px 18px;transform:scale(.7) rotate(-4deg);transition:transform .45s cubic-bezier(.2,1.6,.4,1)}
#cele.on .cc{transform:none}
#celeN{font-family:'Luckiest Guy',sans-serif;font-size:36px;color:var(--brass)}
#celeT{font-family:'Luckiest Guy',sans-serif;font-size:22px;color:var(--cream);margin-top:2px}
#celeSw{width:90px;height:90px;border-radius:50%;margin:14px auto 12px;border:4px solid var(--bit);box-shadow:inset -10px -12px 0 rgba(0,0,0,.35),inset 10px 10px 0 rgba(255,255,255,.25),0 4px 0 var(--bit)}
#celeD{font-size:16px;line-height:1.3;color:var(--cream)}
#cele small{display:block;margin-top:12px;font-size:12.5px;color:#C9AE86}

.row,.icard{position:relative;display:flex;align-items:center;gap:10px;background:var(--panel2);border:2.5px solid var(--bit);border-radius:12px;padding:3px 8px 3px 6px;
  box-shadow:inset 0 2px 0 rgba(255,255,255,.08),inset 0 -3px 0 rgba(0,0,0,.25);flex:1;min-height:0}
.row.flash{animation:flash .5s ease-out}
@keyframes flash{0%{background:#8A6420;box-shadow:0 0 0 3px #FFE08A,inset 0 0 26px rgba(255,220,120,.9)}100%{}}
.row.nope{animation:nope .3s}
@keyframes nope{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.badge{flex:0 0 58px;display:flex;flex-direction:column;align-items:center;gap:3px}
.ic{position:relative;width:50px;height:44px;border-radius:13px;border:3px solid var(--bit);
  background:radial-gradient(circle at 50% 35%,rgba(255,255,255,.55),rgba(255,255,255,0) 60%),var(--tint,#F2B233);
  box-shadow:inset 0 0 0 2px rgba(255,255,255,.25),inset 0 -4px 0 rgba(0,0,0,.18),0 3px 0 var(--bit);display:flex;align-items:center;justify-content:center}
.ic svg{width:36px;height:36px}
.lvl{position:absolute;top:-8px;right:-11px;transform:rotate(8deg);background:var(--brass);color:var(--bit);border:2.5px solid var(--bit);border-radius:7px;
  font-family:'Archivo Black',sans-serif;font-size:11px;padding:0 5px;line-height:15px;box-shadow:0 2px 0 var(--bit)}
.pips{display:flex;gap:2px}
.pips i{width:4px;height:6px;border-radius:2px;background:#1A120E;border:1px solid #000}
.pips i.on{background:var(--brass)}
.info{flex:1;min-width:0}
.nm{font-family:'Luckiest Guy',sans-serif;font-size:18px;letter-spacing:.4px;color:var(--cream);line-height:1.1;padding-top:2px;white-space:nowrap}
.val{font-size:14px;color:var(--dim);line-height:1.15;margin-top:2px}
.val b{color:#9FE3D9;font-weight:700}
.fix{position:absolute;top:-10px;right:104px;display:none;--r:-6deg;transform:rotate(-6deg);background:var(--teal);color:#fff;border:2.5px solid var(--bit);border-radius:7px;
  font-size:12.5px;font-weight:700;padding:0 6px;box-shadow:0 2px 0 var(--bit);animation:bob 1.2s ease-in-out infinite}
.row.fixes .fix{display:block}

/* primary button: brass face, 6px deep lip, 3px outline, gloss band */
.btn{position:relative;border:0;padding:0;background:none;cursor:pointer;touch-action:manipulation;filter:drop-shadow(0 3px 0 rgba(26,18,14,.55));transition:filter .08s}
.btn .lip{display:block;border:3px solid var(--bit);border-radius:14px;background:var(--brassd);padding-bottom:6px}
.btn .face{position:relative;display:flex;align-items:center;justify-content:center;gap:5px;min-height:42px;padding:4px 10px;border-radius:11px 11px 9px 9px;
  background:linear-gradient(#FFD874,var(--brass) 55%,#E39F1F);box-shadow:inset 0 -2px 0 rgba(26,18,14,.25);overflow:hidden;transition:transform .07s}
.btn .face::before{content:"";position:absolute;left:3px;right:3px;top:2px;height:33%;border-radius:8px 8px 40% 40%;background:linear-gradient(rgba(255,255,255,.6),rgba(255,255,255,.12));pointer-events:none}
.btn.down{filter:drop-shadow(0 1px 0 rgba(26,18,14,.55))}
.btn.down .face{transform:translateY(4px)}
.btn.squash{animation:squash .14s ease-out}
@keyframes squash{45%{transform:scale(.96,1.04)}100%{transform:none}}
.btn .lbl,.btn .pr{position:relative;font-family:'Luckiest Guy',sans-serif;font-size:19px;letter-spacing:.4px;color:#FFF9EA;padding-top:3px;white-space:nowrap}
.buy{flex:0 0 100px}
.buy.ok .lip{animation:breathe 1.6s ease-in-out infinite}
@keyframes breathe{50%{transform:scale(1.045)}}
.buy.off .lip{background:#4E3B2E}
.buy.off .face{background:linear-gradient(#A38F79,#857260);box-shadow:none}
.buy.off .face::before{opacity:.35}
.buy.off .pr{color:#E7DCCB}
.buy.off .coin{filter:saturate(.3) brightness(.85)}
.btn.sec .lip{background:#1C6B65}
.btn.sec .face{background:linear-gradient(#5CCDC3,var(--teal) 55%,#238780);min-height:38px}
.btn.sec .lbl{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:15.5px;text-shadow:none;padding-top:0;color:#fff}

.meter{height:13px;border-radius:7px;background:#C99A60;border:2px solid var(--bit);overflow:hidden;margin-top:4px}
.meter i{display:block;height:100%;width:0;border-radius:5px;background:var(--bit);box-shadow:inset 0 2px 0 rgba(255,255,255,.3),inset 0 -2px 0 rgba(0,0,0,.4);transition:width .3s}
.meter.full{background:var(--alarm)}
.loss{color:#FF9B85;font-weight:700}
.pchip{display:flex;align-items:center;gap:5px;background:var(--bit);border:2.5px solid var(--brass);border-radius:10px;padding:5px 9px;
  font-family:'Archivo Black',sans-serif;font-size:16px;color:var(--cream);transform:rotate(4deg);box-shadow:0 3px 0 var(--bit)}
.pchip small{font-family:'Barlow Condensed',sans-serif;font-size:13px;color:var(--dim)}

/* flow tab */
.frow{display:flex;align-items:center;gap:8px;height:30px}
.fdot{flex:0 0 30px;height:25px;border-radius:8px;border:2.5px solid var(--bit);background:var(--tint);display:flex;align-items:center;justify-content:center}
.fdot svg{width:22px;height:22px}
.fname{flex:0 0 78px;font-family:'Luckiest Guy',sans-serif;font-size:17px;padding-top:3px;color:var(--cream)}
.fbar{flex:1;height:16px;border-radius:9px;background:var(--bit);border:2px solid var(--bit);overflow:hidden;position:relative}
.fbar i{display:block;height:100%;width:0;border-radius:7px;background:var(--tint);box-shadow:inset 0 2px 0 rgba(255,255,255,.4);transition:width .35s}
.frow.bn .fbar{box-shadow:0 0 0 2px var(--alarm)}
.fval{flex:0 0 78px;text-align:right;font-family:'Archivo Black',sans-serif;font-size:12px;color:var(--cream);white-space:nowrap}
.fval em{font-style:normal;color:#FF9B85;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:13px;display:block;line-height:1}
.fbtns{display:flex;gap:8px;margin-top:auto}
.fbtns .btn{flex:1}
.fbtns .btn .lbl{font-size:14px}.fbtns{gap:6px}

/* bottom nav */
#nav{position:absolute;left:0;right:0;bottom:0;height:72px;display:flex;z-index:4;background:linear-gradient(#553421,#3B2417 40%,#2E1B10);
  border-top:3px solid var(--bit);box-shadow:inset 0 3px 0 rgba(242,178,51,.35)}
.tab{flex:1;border:0;background:none;padding:0;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;
  transition:transform .2s cubic-bezier(.2,1.6,.4,1);cursor:pointer}
.tab .plate{width:48px;height:40px;display:flex;align-items:center;justify-content:center;border-radius:12px;border:2.5px solid transparent}
.tab svg{width:34px;height:34px;filter:saturate(.6) brightness(.8)}
.tab .tl{font-family:'Luckiest Guy',sans-serif;font-size:13px;color:#BFA27C;letter-spacing:.3px;padding-top:2px}
.tab.on{transform:translateY(-6px)}
.tab.on .plate{background:#6D452A;border-color:var(--bit);box-shadow:inset 0 0 0 2px var(--brass),0 3px 0 var(--bit);animation:breathe 2.2s ease-in-out infinite}
.tab.on svg{filter:none}
.tab.on .tl{color:var(--cream);text-shadow:-1px -1px 0 var(--bit),1px -1px 0 var(--bit),-1px 1px 0 var(--bit),1px 1px 0 var(--bit),1px 2px 0 var(--bit)}
.tab.on::after{content:"";position:absolute;bottom:-2px;left:50%;width:30px;height:5px;margin-left:-15px;background:var(--brass);border-radius:3px;border:1.5px solid var(--bit)}
.bd{position:absolute;top:3px;left:calc(50% + 13px);width:20px;height:20px;border-radius:50%;border:2.5px solid var(--bit);display:none;align-items:center;justify-content:center;
  font-family:'Archivo Black',sans-serif;font-size:11px;font-style:normal;line-height:1;box-shadow:0 2px 0 var(--bit)}
.bd.al{display:flex;background:var(--alarm);color:#fff;animation:bob .9s ease-in-out infinite}
.bd.al::before{content:"!"}
.bd.up{display:flex;background:var(--brass);color:var(--bit);animation:bob 1.5s ease-in-out infinite}
.bd.up::before{content:"+"}

/* character card */
#dim{position:absolute;inset:0;z-index:8;background:transparent;pointer-events:none}
#dim.on{pointer-events:auto}
#card{position:absolute;left:10px;right:10px;bottom:calc(92px + var(--ph));display:flex;gap:11px;align-items:center;padding:10px 12px 11px 10px;z-index:10;
  transform:translateY(calc(var(--ph) + 190px));opacity:0;transition:transform .42s cubic-bezier(.2,1.3,.4,1),opacity .2s;pointer-events:none;cursor:pointer}
#card.show{transform:none;opacity:1;pointer-events:auto}
#card.top{bottom:auto;transform:translateY(-260px)}
#card.show.pass{pointer-events:none}
#card.top.show{transform:none}
#card.pop{animation:wob .35s ease-out}
@keyframes wob{30%{transform:rotate(-1.5deg) scale(1.02)}65%{transform:rotate(1deg)}100%{transform:none}}
.por{position:relative;flex:0 0 72px;width:72px;height:72px;border:3px solid var(--bit);border-radius:13px;overflow:hidden;box-shadow:0 3px 0 var(--bit)}
.por svg{display:block;width:100%;height:100%}
.por::after{content:"";position:absolute;inset:0;border-radius:10px;box-shadow:inset 0 0 0 2.5px var(--brass)}
.ctext{flex:1;min-width:0}
.who{display:inline-block;font-family:'Luckiest Guy',sans-serif;font-size:17px;color:var(--brass);transform:rotate(-2deg);transform-origin:left;padding-top:2px}
.txt{font-size:16px;line-height:1.22;color:var(--cream);margin-top:2px}
.more{font-size:12.5px;color:#C9AE86;margin-top:4px;display:none}
#card.modal .more{display:block}

@media (max-height:720px){:root{--ph:226px}.nm{font-size:16.5px}.val{font-size:13px}.row .ic{height:38px}}
@media (prefers-reduced-motion:reduce){.buy.ok .lip,.bd,.stk,.fix,.bneck .dot,.tab.on .plate{animation:none}}

/* ============ Art direction: what you can press vs. what just informs ============
   PRESSABLE: raised face, 6px lip, gloss band, drop shadow, heavy ink outline. Moves when pressed.
   INFORMATION: set into the panel. Recessed tray, inner shadow, thin muted outline, no gloss, no drop shadow. */
.rows>.row,.rows>.icard,.bcard,.land,.routecard,.ktarget{background:#2A180E;border:2px solid rgba(0,0,0,.62);box-shadow:inset 0 3px 0 rgba(0,0,0,.38),inset 0 -1px 0 rgba(255,236,200,.08)}
.row.isnew{box-shadow:inset 0 3px 0 rgba(0,0,0,.38),0 0 0 2px rgba(92,205,195,.7)}
.ic,.land .ic{border:2px solid rgba(0,0,0,.7);background:var(--tint,#F2B233);box-shadow:inset 0 0 0 2px rgba(255,255,255,.16),inset 0 -4px 0 rgba(0,0,0,.18)}
.lvl{box-shadow:none;border:2px solid rgba(0,0,0,.7);transform:none;top:-6px;right:-8px;background:#E8C66A}
.nm{text-shadow:-1.5px -1.5px 0 var(--bit),1.5px -1.5px 0 var(--bit),-1.5px 1.5px 0 var(--bit),1.5px 1.5px 0 var(--bit),0 2px 0 var(--bit)}
.chip{border:1.5px solid rgba(242,178,51,.5);background:rgba(20,12,8,.92)}
.stk,.fix,.row .newtag,.stk.nw{box-shadow:none;border:2px solid rgba(0,0,0,.7);animation:none}
.ribbon{box-shadow:none;border-width:2.5px}
.pchip{box-shadow:none;transform:none;border:1.5px solid rgba(242,178,51,.55);background:rgba(20,12,8,.92)}
.bchip{border:1px solid rgba(255,255,255,.08)}
.bdot,.fdot{box-shadow:none;border-width:2px}
.pstrip{border:2px solid rgba(0,0,0,.65);box-shadow:inset 0 3px 0 rgba(0,0,0,.4),inset 0 0 0 2px rgba(92,205,195,.18)}
#cashbox{box-shadow:inset 0 0 0 2px var(--panel),inset 0 0 0 5px var(--brass),inset 0 0 0 7px rgba(0,0,0,.28),inset 0 -6px 12px rgba(0,0,0,.35)}
#cashbox::before{display:none}
.bneck{box-shadow:none;border:2px solid rgba(0,0,0,.6);background:rgba(20,12,8,.8);transform:none;cursor:default}
.goal{box-shadow:none;border:2px solid rgba(0,0,0,.6);background:rgba(20,12,8,.8);transform:none;cursor:default}
/* a goal only becomes a button when there is something to do */
.goal.ready{cursor:pointer;border:3px solid var(--bit);background:linear-gradient(#5CCDC3,var(--teal) 55%,#238780);box-shadow:0 6px 0 #1C6B65,0 6px 0 3px var(--bit);animation:none;transform:translateY(-3px)}
.goal.ready:active{transform:translateY(2px);box-shadow:0 1px 0 #1C6B65,0 1px 0 3px var(--bit)}
/* hire chips are actions: they get the raised treatment */
.chip-hire{border:3px solid var(--bit);background:linear-gradient(#3F7F77,#2B5E58);box-shadow:0 5px 0 #173F3B,0 5px 0 3px var(--bit);transform:translateY(-2px);margin-bottom:5px}
.chip-hire:active{transform:translateY(3px);box-shadow:0 0 0 #173F3B,0 0 0 3px var(--bit)}
.chip-hire span b{color:#DDF6F2}
/* every real button moves when pressed and shows a pointer */
.btn{cursor:pointer}
.btn.off{filter:saturate(.35) drop-shadow(0 2px 0 rgba(26,18,14,.4));cursor:default}
.buy.ok .lip{animation:none}.buy.ok{animation:nudge 2.4s ease-in-out infinite}@keyframes nudge{0%,86%,100%{transform:none}92%{transform:translateY(-3px)}}
.tab{cursor:pointer}
@media (max-width:360px){.nm{font-size:16px}.val{font-size:13px}.btn .pr,.btn .lbl{font-size:16px}.buy{flex:0 0 88px}}
</style>

<script>
(function(){
'use strict';
/* ============================================================
   CRUDE — Playable 3.4: swipe, zoom, fit, and clearer buttons
   Market price line, six buyers with demand saturation, grade,
   strata, five events, crew, offline earnings.
   Every balance number lives in CFG.
   ============================================================ */
const BIT='#1A120E',BRASS='#F2B233',BRASSD='#A8701A',TEAL='#2FA39B',ALARM='#E04B2F',SAND='#E3B778',SANDSH='#B3814B';
const SC={well:'#F2B233',plant:'#2FA39B',yard:'#EF7D3C',term:'#F4D9A6'};
const SN={well:'Well',plant:'Plant',yard:'Yard',term:'Terminal',flow:'Site'};

const CFG={
  price:1.5,                                              // market baseline, $ per barrel
  beam:  {base:15, g:1.55, v0:2,   vg:1.30},

/* ---------------- underground ----------------
   A seeded grid under the field. Rows map to strata, pockets hide until scanned,
   rock blocks pipes, gas cells are captured by routing a pipe through them.       */
function rng(seed){return ()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function rowStratum(r){return Math.min(4,Math.floor(r/2));}
function cellX(c){return CFG.ug.col0+c*CFG.ug.cell+CFG.ug.cell/2;}
function cellY(r){return r*CFG.ug.cell+CFG.ug.cell/2;}
function cellAt(x,y){const U=CFG.ug;const c=Math.floor((x-U.col0)/U.cell),r=Math.floor(y/U.cell);return (c<0||r<0||c>=U.cols||r>=U.rows)?null:[c,r];}
function slotWellX(k){const s=1+Math.min(S.lv.beam,10)*.025;if(k===0)return wellheadX();const j=JSPOTS[k-1];return j.x-138*s*j.s;}
function slotCol(k){return cellAt(slotWellX(k),1)[0];}
function genUnderground(){const U=CFG.ug,seed=(Math.random()*1e9)|0,rand=rng(seed),grid=[];
  for(let r=0;r<U.rows;r++){grid.push([]);for(let c=0;c<U.cols;c++)grid[r].push(r>=1&&rand()<U.rock+r*.01?1:0);}
  const pockets=[];let id=0;
  const place=(s,cMin,cMax,lease,found)=>{for(let tries=0;tries<60;tries++){const c=cMin+Math.floor(rand()*(cMax-cMin)),r=s===4?8+Math.floor(rand()*3):s*2+Math.floor(rand()*2);
      if(r<1||pockets.some(p=>Math.abs(p.c-c)<3&&Math.abs(p.r-r)<2))continue;const size=Math.round(U.strokes[s]*(.75+rand()*.5));
      grid[r][c]=0;if(c+1<U.cols)grid[r][c+1]=0;const p={id:id++,c,r,s,size,left:size,found:!!found,lease,linked:-1};pockets.push(p);return p;}};
  const starter=place(0,3,5,'home',true);
  for(let s=0;s<5;s++){for(let i=0;i<(s===0?2:3);i++)place(s,0,U.leaseCols-1,'home');for(let i=0;i<2;i++)place(s,U.leaseCols,U.cols-1,'east');}
  const gas=[];for(let i=0;i<8;i++){const c=Math.floor(rand()*U.cols),r=1+Math.floor(rand()*8);if(!grid[r][c]&&!pockets.some(p=>p.r===r&&(p.c===c||p.c+1===c)))gas.push({c,r,amt:1+Math.floor(rand()*2),found:false});}
  // every pocket must be reachable: clear a shaft above any pocket the flood fill can't reach
  const reach=()=>{const seen=grid.map(r=>r.map(()=>0)),q=[];for(let c=0;c<U.cols;c++){if(!grid[0][c]){seen[0][c]=1;q.push([c,0]);}}
    while(q.length){const [c,r]=q.shift();for(const [dc,dr] of [[1,0],[-1,0],[0,1],[0,-1]]){const nc=c+dc,nr=r+dr;if(nc<0||nr<0||nc>=U.cols||nr>=U.rows||seen[nr][nc]||grid[nr][nc])continue;seen[nr][nc]=1;q.push([nc,nr]);}}return seen;};
  let s1=reach();for(const p of pockets)if(!s1[p.r][p.c])for(let r=0;r<p.r;r++)grid[r][p.c]=0;
  // the main well starts piped straight down into the starter pocket
  const sc=Math.floor((GEO.wellX-118-20-U.col0)/U.cell),cells=[];for(let r=0;r<=starter.r;r++){grid[r][sc]=0;cells.push([sc,r]);}
  for(let c=sc+1;c<=starter.c;c++){grid[starter.r][c]=0;cells.push([c,starter.r]);}
  starter.linked=0;
  return {seed,grid,pockets,gas,scans:[],links:[{pocket:starter.id,cells}]};}
function pocketById(id){return S.ug.pockets.find(p=>p.id===id);}
// a spent pocket that no jack is piped into is just ground: pipes can pass through it
function spent(p){return p.left<=0&&p.linked<0;}
function pocketAtCell(c,r){return S.ug.pockets.find(p=>!spent(p)&&p.r===r&&(p.c===c||p.c+1===c));}
function deplF(p){return p.left<=0?0:CFG.ug.floor+(1-CFG.ug.floor)*p.left/p.size;}
function pocketMins(p){const spm=Math.max(1,d.spm||20);return p.left/spm;}
function fmtMins(m){return m>=90?(m/60).toFixed(1)+' h':Math.max(1,Math.round(m))+' min';}
function slotDry(k){const l=linkOf(k);return !!l&&pocketById(l.pocket).left<=0;}

function pumpedStratum(){let s=0;for(let k=0;k<4;k++){const l=linkOf(k);if(l&&k<Math.min(4,1+S.lv.wells))s=Math.max(s,pocketById(l.pocket).s);}return s;}

function cellBlocked(c,r,ignoreSlot){const U=CFG.ug;if(c>=U.leaseCols&&!S.lease.east)return 'lease';
  if(rowStratum(r)>S.lv.drill)return 'depth';for(let k=0;k<S.ug.links.length;k++){if(k===ignoreSlot)continue;const l=S.ug.links[k];if(l&&l.cells&&l.cells.some(x=>x[0]===c&&x[1]===r))return 'pipe';}return '';}

function startRoute(k){if(!S.ug)return;const c=slotCol(k);R.route={slot:k,cells:[[c,0]],target:null};sfx.tick();}
function routeTap(c,r){const RT=R.route;if(!RT)return;const cells=RT.cells,last=cells[cells.length-1];

function routeGas(cells){return S.ug.gas.filter(g=>cells.some(x=>x[0]===g.c&&x[1]===g.r));}
function confirmRoute(auto){const RT=R.route;if(!RT||RT.target==null)return false;const p=pocketById(RT.target),c=routeCost(RT.cells,p);if(S.cash<c){sfx.fail();return false;}if(!auto&&linkOf(RT.slot))stat('repipe');

  let blasted=0;for(const [c,r] of RT.cells)if(isRock(c,r)){S.ug.grid[r][c]=0;blasted++;const x=cellX(c),y=cellY(r);for(let i=0;i<10;i++)part({type:'spark',x,y,vx:(Math.random()-.5)*220,vy:-60-Math.random()*160,g:420,r:3+Math.random()*3,life:.8,col:i%2?'#8C8378':'#F7A33A'});}

function pullPipe(k){const l=linkOf(k);if(!l)return false;const pk=pocketById(l.pocket);if(pk)pk.linked=-1;S.ug.links[k]=null;
  const x=slotWellX(k);for(let i=0;i<8;i++)part({type:'dust',x:x+(Math.random()-.5)*40,y:-4,vx:(Math.random()-.5)*60,vy:-20-Math.random()*30,r:5,grow:14,life:.8,col:'#F3D9A8'});

function autoRoute(k,pid){const U=CFG.ug,p=pocketById(pid),start=[slotCol(k),0],key=(c,r)=>c+','+r,dist={},prev={},open=[[0,start]];dist[key(...start)]=0;prev[key(...start)]=null;
  while(open.length){open.sort((a,b)=>a[0]-b[0]);const [dc0,[c,r]]=open.shift();if(dc0>dist[key(c,r)])continue;
    if(pocketAtCell(c,r)===p){const out=[];let cur=[c,r];while(cur){out.unshift(cur);cur=prev[key(...cur)];}return out;}
    for(const [dc,dr] of [[1,0],[-1,0],[0,1],[0,-1]]){const nc=c+dc,nr=r+dr;if(nc<0||nr<0||nc>=U.cols||nr>=U.rows)continue;const pp=pocketAtCell(nc,nr);
      if(pp&&pp!==p)continue;if(!pp&&cellBlocked(nc,nr,k))continue;if(pp&&rowStratum(nr)>S.lv.drill)continue;
      const w=(!pp&&isRock(nc,nr))?CFG.pipe.rockMul:1,nd=dc0+w,kk=key(nc,nr);if(kk in dist&&dist[kk]<=nd)continue;dist[kk]=nd;prev[kk]=[c,r];open.push([nd,[nc,nr]]);}}

function releaseGas(){if(S.gas<1||R.gasT>0){sfx.fail();return false;}S.gas--;R.gasT=CFG.gas.secs;sfx.alarm();floatText(1480,-170,'Gas released: price +'+Math.round((CFG.gas.boost-1)*100)+'%','#BFE3F2',18);tutEvent('gasUse');save();return true;}

/* ---------------- numbers ---------------- */
function tierCost(id,l){const a=CFG[id].costs;return l<a.length?a[l]:Infinity;}
function gradeOf(lv){const c=CFG.grade,raw=c.base+CFG.desal.per*lv.desal+Math.min(lv.maint,10)-CFG.drill.pen[S.ug?pumpedStratum():0];
  const ceil=Math.min(100,c.ceil0+c.ceilPer*lv.licence);return {grade:Math.max(0,Math.min(ceil,raw)),ceil,raw};}
function eligible(i,lv,grade){const b=CFG.buyers[i];if(i>lv.contracts)return 'contract';if(b.lic&&lv.licence<b.lic)return 'licence';if(grade<b.min)return 'grade';return '';}
function derive(lv){lv=lv||S.lv;const c=CFG,cr=S.crew;
  const rich=1;
  const bps=c.beam.v0*Math.pow(c.beam.vg,lv.beam)*(cr.rough?1.05:1);
  const spm=lv.motor?c.motor.spm0*Math.pow(c.motor.spmg,lv.motor-1):0,sps=spm/60;
  const sep=c.sep.v0*Math.pow(c.sep.vg,lv.sep)*(cr.eng?1.05:1),pitCap=c.sep.pit0*Math.pow(c.sep.pitg,lv.sep);
  const tanks=Math.min(c.tank.max,c.tank.start+Math.floor(lv.tank/2)),tankCap=c.tank.cap0*Math.pow(c.tank.capg,lv.tank);
  const loadTotal=c.tank.loadPerTank*tanks,bays=Math.min(4,tanks),loadPerBay=loadTotal/bays;
  const trucks=Math.min(c.fleet.max,c.fleet.start+lv.fleet),tier=Math.floor(lv.fleet/c.fleet.tierEvery),tcap=c.fleet.cap0*Math.pow(c.fleet.tierMul,tier);
  const wells=Math.min(c.wells.max,1+lv.wells),roadMul=Math.pow(c.road.mul,lv.road),speed=c.truck.speed*roadMul;
  const unload=cr.disp?0:c.truck.unload;

  const yard=Math.min(trucks*tcap/rt,loadTotal);

  if(term===0)term=c.buyers[0].dem;
  const holdCap=lv.trade?c.trade.cap0*Math.pow(c.trade.capg,lv.trade-1):0;
  const pk=c.pickup,pkX=S.built.plant?GEO.rackB:GEO.rackA,pkDist=GEO.termX-pkX,haul=pk.cap/(2*pkDist/pk.speed+pk.cap/pk.load+pk.unload);
  const rackCap=S.built.plant?pk.rackB:pk.rackA;
  return {wells,roadMul,speed,rich,bps,spm,sps,sep,pitCap,tanks,tankCap,loadTotal,bays,loadPerBay,trucks,tier,tcap,rt,unload,yard,mul,
    well:sps*bps*wellFactor(wells),grade:G.grade,ceil:G.ceil,rawGrade:G.raw,term,top,holdCap,haul,pkX,rackCap};}
function wellFactor(wells){if(!S.ug)return wells;let f=0;for(let k=0;k<Math.min(4,wells);k++)f+=slotFactor(k);return f+Math.max(0,wells-4);}
function cost(id,l){if(l===undefined)l=S.lv[id];if(TIERED[id])return tierCost(id,l);const c=CFG[id];
  return Math.ceil(id==='motor'?(l===0?c.first:c.base*Math.pow(c.g,l-1)):c.base*Math.pow(c.g,l));}

  return (id==='fleet'&&l>=CFG.fleet.max-1)||(id==='wells'&&l>=CFG.wells.max-1)||(id==='trade'&&l>=CFG.trade.max);}
function roadName(l){return l<3?'Dirt track':l<6?'Graded gravel':l<9?'Blacktop':'Highway grade';}
function fmt(n){if(!isFinite(n))return '∞';n=Math.max(0,n);if(n<1000)return n<10?String(Math.round(n*10)/10):String(Math.floor(n));
  const u=['K','M','B','T','Qa','Qi','Sx'];let i=-1;while(n>=1000&&i<u.length-1){n/=1000;i++;}return (n<10?n.toFixed(2):n<100?n.toFixed(1):Math.floor(n))+u[i];}
function fr(n){return n<10?n.toFixed(2):n<100?n.toFixed(1):fmt(n);}
function money(n){n=Math.max(0,n);return '$'+(n<1000?Math.floor(n):fmt(n));}
function repairNeed(){return Math.max(2,6-Math.floor(S.lv.maint/2));}
function desc(id){const a=d,L=S.lv[id],nl=Object.assign({},S.lv);nl[id]++;const b=derive(nl),mx=maxed(id);

    case 'wells':{const idle=[...Array(Math.min(4,a.wells)).keys()].filter(k=>!linkOf(k)).length;return [`${a.wells} pumpjack${a.wells>1?'s':''}`+(idle?`, ${idle} needs a pipe`:''),mx?'':(b.wells<=4?`${b.wells}, piped by you`:`${b.wells}`)];}

const RK={well:'well',plant:'sep',yard:'yard',term:'term'};
function fixesJam(id){if(!S.lv.motor||!S.flags.bnIntro||TST[id]!==R.bn)return false;if(R.bn==='well'&&S.ug&&[0,1,2,3].some(k=>k<Math.min(4,d.wells)&&slotDry(k)))return false;if(R.ev&&R.ev.type==='break'&&R.ev.st===R.bn)return false;const nl=Object.assign({},S.lv);nl[id]++;const b=derive(nl),k=RK[R.bn];return b[k]>d[k]*1.005;}
function stations(){const a=['well'];if(S.built.plant)a.push('plant');a.push('yard','term');return a;}
function effRate(st){if(st==='plant'&&!S.built.plant)return Infinity;

function rateOf(st){return effRate(st);}
function computeBn(){let bn='well',m=effRate('well');
  for(const k of stations().slice(1)){const r=effRate(k);if(r<m-1e-9){m=r;bn=k;}}
  const old=R.bn;R.bn=bn;R.chain=m;if(old!==bn)onBnChange(bn);}
function wellheadX(){return GEO.wellX-138*(1+Math.min(S.lv.beam,10)*0.025);}
function oilCol(){return CFG.drill.oil[S.ug?pumpedStratum():0];}
function gradeNow(){return Math.max(0,d.grade-(R.ev&&R.ev.type==='gusher'?30:0));}
function gradeMult(){return .85+.3*gradeNow()/100;}
function rawUnit(){return R.price*CFG.pickup.rawMul*d.mul;}

/* ---------------- trucks ---------------- */
let truckId=0;
function addTruck(x,state){const t={id:++truckId,state,x,y:8,v:0,load:0,idle:0,t:0,tilt:0,tv:0,dir:-1,slotX:x,qi:0,arr:0,loading:false};
  R.trucks.push(t);if(state==='yard')R.yardQ.push(t);return t;}
function slotX(i,n){const b=d.bays;if(i<b)return GEO.bay0-i*GEO.bayGap;const sp=Math.min(70,260/Math.max(1,n-b));return GEO.bay0-b*GEO.bayGap-(i-b)*sp+20;}
function syncTrucks(){if(!S.built.yard)return;while(R.trucks.length<d.trucks)addTruck(GEO.bay0-700-R.trucks.length*30,'back');}

/* ---------------- market ---------------- */
function updMarket(dt){const m=CFG.market;R.mt+=dt;
  const want=S.lv.trade?m.vol:m.vol0;R.volNow+=(want-R.volNow)*Math.min(1,dt*.05);
  R.noise+=(Math.random()-.5)*dt*1.4;R.noise*=Math.exp(-dt*.25);R.noise=Math.max(-1,Math.min(1,R.noise));
  const spikeT=(R.ev&&R.ev.type==='spike'?1.6:1)*(R.gasT>0?CFG.gas.boost:1);R.spike+=(spikeT-R.spike)*Math.min(1,dt*1.5);
  const u=R.mt/m.period*Math.PI*2;
  R.price=CFG.price*(1+R.volNow*(.62*Math.sin(u)+.28*Math.sin(u*3.83+1.3)+.1*R.noise))*R.spike;
  R.histT+=dt;if(R.histT>=1){R.histT=0;R.hist.push(R.price);if(R.hist.length>180)R.hist.shift();R.avg=R.hist.reduce((a,b)=>a+b,0)/R.hist.length;}}

/* ---------------- buyers + demand saturation ---------------- */
function unitPrice(i){const b=CFG.buyers[i],st=R.buy[i];const base=b.fixed?CFG.price:R.price;
  return base*b.prem*gradeMult()*d.mul*(b.steady&&st.streak>=60?b.steady:1);}
function capOf(i){return CFG.buyers[i].dem*CFG.sat.window;}
function live(i){return !eligible(i,S.lv,d.grade)&&S.w[i]>0;}
function satMult(i){const c=capOf(i),F=R.buy[i].F;return F<=c?1:Math.max(CFG.sat.floor,1-.6*Math.min(1,(F-c)/c));}
/* sell up to bbl barrels across buyers by allocation weight; returns [value, barrels actually taken] */
function sellBarrels(bbl){const idx=CFG.buyers.map((_,i)=>i).filter(live);if(!idx.length)idx.push(0);
  let left=bbl,value=0,guard=0;
  while(left>1e-6&&guard++<4){const open=idx.filter(i=>R.buy[i].F<capOf(i)*CFG.sat.block);if(!open.length)break;
    const tw=open.reduce((a,i)=>a+Math.max(1,S.w[i]),0);let used=0;
    for(const i of open){const share=left*Math.max(1,S.w[i])/tw,st=R.buy[i],c=capOf(i),room=c*CFG.sat.block-st.F,x=Math.min(share,room);if(x<=0)continue;
      const full=Math.min(x,Math.max(0,c-st.F)),over=x-full,mid=st.F+full+over/2,om=over>0?Math.max(CFG.sat.floor,1-.6*Math.min(1,(mid-c)/c)):1;
      value+=unitPrice(i)*(full+over*om);st.F+=x;st.last=R.t;used+=x;}
    left-=used;if(used<1e-6)break;}
  return [value,bbl-left];}
function updBuyers(dt){CFG.buyers.forEach((b,i)=>{const st=R.buy[i];const was=st.F>capOf(i);st.F=Math.max(0,st.F-b.dem*dt);if(!was&&st.F>capOf(i)*1.02&&live(i)&&S.flags.buyers&&!S.crew.logi)stat('sat');
  if(b.steady){if(R.t-st.last<15&&live(i))st.streak+=dt;else st.streak=0;}});}
function gateBlocked(){const idx=CFG.buyers.map((_,i)=>i).filter(live);if(!idx.length)idx.push(0);return idx.every(i=>R.buy[i].F>=capOf(i)*CFG.sat.block);}
function unitAvg(){if(!S.built.plant)return rawUnit();let u=0,tw=0;CFG.buyers.forEach((b,i)=>{if(live(i)){u+=S.w[i]*unitPrice(i)*satMult(i);tw+=S.w[i];}});return tw?u/tw:unitPrice(0)*satMult(0);}
function bestUnit(){let best=unitPrice(0);CFG.buyers.forEach((b,i)=>{if(!eligible(i,S.lv,d.grade))best=Math.max(best,unitPrice(i));});return best;}

/* ---------------- simulation ---------------- */
function addRaw(a){if(!S.built.plant){addRack(a,true);return;}S.pit+=a;if(S.pit>d.pitCap){const over=S.pit-d.pitCap;S.pit=d.pitCap;
  if(R.bn==='plant'&&S.lv.motor>0){const s=Math.min(over,R.pitBudget);R.pitBudget-=s;R.spillPitAcc+=s;}}}
function addRack(a,raw){S.rack+=a;if(S.rack>d.rackCap){const over=S.rack-d.rackCap;S.rack=d.rackCap;if(S.lv.motor>0){R.spillRackAcc+=Math.min(over,CFG.spillCap*Math.max(R.chain,.4)*.05);}}}
function emit(a,manual){if(R.ev&&R.ev.type==='gusher'){const sp=a*.25;R.spillWellAcc+=sp;a-=sp;}
  addRaw(a);R.slugs.push({p:0,len:Math.min(46,12+a*3)});
  if(manual)floatText(wellheadX()+14,-96,'+'+fr(a).replace(/\.00$/,'')+' bbl','#FFF3DC',17);}
function wellMul(){return (R.ev&&R.ev.type==='gusher')?3:1;}
function updWell(dt){const P=CFG.psi;R.psi=P.base+(R.psi-P.base)*Math.exp(-dt/P.decay);
  if(R.ev&&R.ev.type==='break'&&R.ev.st==='well')return;
  if(S.lv.motor===0){
    if(R.strokeQ>0){const p=R.mrev;R.mrev+=dt*CFG.manualSps;if(p<.5&&R.mrev>=.5){const f=slotFactor(0)||1,l=linkOf(0);if(l){const pk=pocketById(l.pocket);pk.left=Math.max(0,pk.left-1);}emit(d.bps*f,true);}if(R.mrev>=1){R.mrev=0;R.strokeQ--;}}
  }else{
    const f=Math.sqrt(R.psi/P.base),p=R.rev;R.rev+=d.sps*f*dt;
    const n=Math.floor(R.rev+.5)-Math.floor(p+.5);if(n>0){const base=d.bps*f*n*wellMul();let tot=0;for(let k=0;k<Math.min(4,d.wells);k++){const l=linkOf(k);if(!l)continue;const pk=pocketById(l.pocket),a=base*CFG.drill.rich[pk.s]*deplF(pk);const was=pk.left>0;pk.left=Math.max(0,pk.left-f*n*(pk.left>0?1:0));if(was&&pk.left<=0){stat('dry');R.dryNote=k;d=derive();computeBn();}tot+=a;}
      tot+=base*Math.max(0,d.wells-4);if(tot>0)emit(tot,false);if(Math.random()<.02){d=derive();computeBn();}}
    if(R.rev>1e6)R.rev-=1e6;
  }}
function updPlant(dt){if(!S.built.plant)return;if(!S.built.yard){const room=d.rackCap-S.rack;let proc=Math.min(S.pit,d.sep*dt,Math.max(0,room));R.plantActive=proc>1e-6;R.plantThrottled=room<=0;S.pit-=proc;S.rack+=proc;return;}
  const broken=R.ev&&R.ev.type==='break'&&R.ev.st==='plant';const room=d.tankCap-S.tank;let proc=broken?0:Math.min(S.pit,d.sep*dt);
  R.plantActive=proc>1e-6;R.plantThrottled=false;
  if(proc>room){const over=proc-room,s=R.bn==='yard'?Math.min(over,R.tankBudget):0;R.tankBudget-=s;R.spillTankAcc+=s;proc=Math.max(0,room)+s;S.tank=d.tankCap;R.plantThrottled=true;}
  else S.tank+=proc;
  S.pit-=proc;}
function updPickup(dt){const P=R.pickup,c=CFG.pickup;if(!P)return;const home=d.pkX;
  let tx=P.state==='load'?home:P.state==='back'?home:GEO.termX-10;
  const dx=tx-P.x,want=Math.sign(dx)*Math.min(c.speed,Math.abs(dx)*2.5),dv=Math.max(-300*dt,Math.min(300*dt,want-P.v));P.v+=dv;P.x+=P.v*dt;if(Math.abs(P.v)>3)P.dir=P.v>0?1:-1;
  const tg=Math.max(-.05,Math.min(.05,-(dv/dt)*P.dir*0.0002));P.tv+=((tg-P.tilt)*220-P.tv*14)*dt;P.tilt+=P.tv*dt;
  if(P.state==='load'&&Math.abs(dx)<3){const amt=Math.min(c.load*dt,c.cap-P.load,S.rack);if(amt>1e-6){P.load+=amt;S.rack-=amt;P.idle=0;}else P.idle+=dt;
    if(P.load>=c.cap-1e-6||(P.load>0&&P.idle>c.idle))P.state='out';}
  else if(P.state==='out'&&Math.abs(dx)<3){P.state='unload';P.t=S.crew.disp?0:c.unload;}
  else if(P.state==='unload'){P.t-=dt;if(P.t<=0){sellPickup(false);P.state='back';}}
  else if(P.state==='back'&&Math.abs(dx)<3)P.state='load';}
function sellPickup(tapped){const P=R.pickup;if(!P||P.load<=0)return;let v;
  if(!S.built.plant)v=P.load*rawUnit();else{const r=sellBarrels(P.load);v=r[0];}P.load=0;payout(v,P.x,-46,tapped);
  S.flags.firstSale=1;}
function updTrucks(dt){if(!S.built.yard){updPickup(dt);return;}const q=R.yardQ,n=q.length;q.forEach((t,i)=>t.slotX=slotX(i,n));const endX=slotX(n,n+1);
  const yardBroken=R.ev&&R.ev.type==='break'&&R.ev.st==='yard',stormMul=R.ev&&R.ev.type==='storm'?.5:1;
  // gate queue: first two arrivals unload, the rest wait in line down the road
  const atGate=R.trucks.filter(t=>t.state==='out'||t.state==='unload').sort((a,b)=>a.arr-b.arr);atGate.forEach((t,k)=>t.qi=k);R.termQ=Math.max(0,atGate.length-2);
  for(const t of R.trucks){
    let tx;if(t.state==='yard')tx=t.slotX;else if(t.state==='out'||t.state==='unload')tx=GEO.termX-(t.qi<2?t.qi*16:32+(t.qi-1)*84);else tx=endX;
    const dx=tx-t.x,want=Math.sign(dx)*Math.min(d.speed*stormMul,Math.abs(dx)*2.5),acc=240;
    const dv=Math.max(-acc*dt,Math.min(acc*dt,want-t.v));t.v+=dv;t.x+=t.v*dt;
    if(Math.abs(t.v)>3)t.dir=t.v>0?1:-1;
    const a=dv/dt,tg=Math.max(-.05,Math.min(.05,-a*t.dir*0.00022));
    t.tv+=((tg-t.tilt)*220-t.tv*14)*dt;t.tilt+=t.tv*dt;
    const lane=t.state==='back'?-8:8;t.y+=(lane-t.y)*Math.min(1,dt*3);
    if(t.state==='yard'){const i=q.indexOf(t);
      if(i>-1&&i<d.bays&&Math.abs(dx)<3&&!yardBroken){const amt=Math.min(d.loadPerBay*dt,d.tcap-t.load,S.tank);
        if(amt>1e-6){t.load+=amt;S.tank-=amt;t.idle=0;t.loading=true;}else{t.idle+=dt;t.loading=false;}
        if(t.load>=d.tcap-1e-6||(t.load>0&&t.idle>CFG.truck.idleDepart)){q.splice(i,1);t.state='out';t.loading=false;t.arr=R.t;}
      }else t.loading=false;
    }else if(t.state==='out'){if(t.qi<2&&Math.abs(dx)<3){t.state='unload';t.t=d.unload;}}
    else if(t.state==='unload'){t.t-=dt;if(t.t<=0){sell(t,false);if(t.load<=1e-6)t.state='back';else t.t=.6;}}
    else if(t.state==='back'){if(Math.abs(dx)<4){t.state='yard';q.push(t);t.idle=0;}}
  }}
function step(dt){R.t+=dt;S.playT+=dt;
  const cap=CFG.spillCap*Math.max(R.chain,0.4);
  R.pitBudget=Math.min(cap*2,R.pitBudget+cap*dt);R.tankBudget=Math.min(cap*2,R.tankBudget+cap*dt);
  R.gasT=Math.max(0,R.gasT-dt);
  updMarket(dt);updBuyers(dt);updEvents(dt);updCrew(dt);
  updWell(dt);updPlant(dt);updTrucks(dt);
  const a=1-Math.exp(-dt/2.5);
  R.lossRack+=(R.spillRackAcc/dt-R.lossRack)*a;R.spillSec+=R.spillRackAcc;R.spillRackAcc=0;
  R.lossPit+=(R.spillPitAcc/dt-R.lossPit)*a;R.lossTank+=(R.spillTankAcc/dt-R.lossTank)*a;R.lossWell+=(R.spillWellAcc/dt-R.lossWell)*a;
  R.spillSec+=R.spillPitAcc+R.spillTankAcc+R.spillWellAcc;
  R.spillPitAcc=0;R.spillTankAcc=0;R.spillWellAcc=0;
  if(Math.floor(R.t)!==Math.floor(R.t-dt)){R.spillLog.push(R.spillSec);R.spillSec=0;if(R.spillLog.length>120)R.spillLog.shift();computeBn();}
  if(false){
    if(R.lossPit>0.05&&!S.flags.spillPit){S.flags.spillPit=1;say('yara',"Pit's topped out and it's running onto the sand. More pump won't fix that. The separator will.");}
    if(R.lossTank>0.05&&!S.flags.spillTank){S.flags.spillTank=1;say('yara',"That's clean crude on the ground. The expensive kind. Trucks or tanks, not more pump.");}
  }}

/* ---------------- selling ---------------- */
function payout(v,wx,wy,tapped,label){if(v<=0)return;S.cash+=v;S.life+=v;
  R.streak=(R.t-R.lastSale<2.5)?Math.min(R.streak+1,14):0;R.lastSale=R.t;
  const sp=w2s(wx,wy);spawnCoins(sp.x,sp.y,v,R.streak);floatText(wx,wy-38,(label||'+')+money(v),'#FFE08A',22);
  if(R.tab==='term')R.punch=Math.min(1,R.punch+.6);if(tapped){burst(wx,wy+16,'#F7C63F',10);vibe([8,30,8]);}milestones();}
function sell(t,tapped){if(t.load<=0)return;
  // trading desk: park barrels at the terminal instead of selling
  if(S.holdOn&&S.lv.trade&&S.hold<d.holdCap){const x=Math.min(t.load,d.holdCap-S.hold);S.hold+=x;t.load-=x;floatText(t.x,-84,'+'+fmt(x)+' held','#9FE3D9',18);if(t.load<=1e-6){t.load=0;return;}}
  const [v,taken]=sellBarrels(t.load);t.load-=taken;if(t.load<1e-6)t.load=0;
  if(taken<=0){return;}
  payout(v,t.x,t.y-46,tapped);
  S.flags.firstSale=1;
  if(!tapped&&S.lv.motor>0)S.flags.autoSales=(S.flags.autoSales||0)+1;}
function sellHold(auto){if(S.hold<=0)return;if(!auto)stat('holdSell');const v=S.hold*R.price/CFG.price*bestUnit()*.9;S.hold=0;
  payout(v,1480,-150,false,auto?'Auto +':'+');sfx.buy();if(!auto)vibe(15);}
function milestones(){const M=[[1e3,'k1',"A thousand dollars. The scrapper offered me more. Keep going."],[1e4,'k2',"You are no longer losing me money. That is a start."],
  [1e5,'k3',"My accountant asked who you are. I told him to wait."],[1e6,'k4',"A million. I remember when this field did that. Carry on."],[1e7,'k5',"Ten million. People are asking me about Field 7. I have not told them anything."]];
  for(const [v,f,l] of M)if(S.life>=v&&!S.flags[f]){S.flags[f]=1;say('khalid',l);}}
function sayRaw(w,t,o){say(w,t,o);}
function onBnChange(bn){return;
  if(!S.built.yard||(bn==='term'&&!S.flags.buyers))return;
  if(R.ev&&R.ev.type==='break')return;
  if(R.t-R.lastYara<18||R.t-(R.lineAt[bn]||-99)<75)return;R.lineAt[bn]=R.t;
  const L={well:"Wells aren't keeping up. Trucks are sitting with their engines off.",plant:"Separator's the choke now. Raw is backing up in the pit.",yard:"Trucks can't haul it fast enough. The tanks are filling.",term:"The buyers are full. Trucks are queuing at the gate. That's a contracts problem, not a machine one."};
  say('yara',L[bn],{bn});}

/* ---------------- crew ---------------- */
function stat(k,n){S.stats[k]=(S.stats[k]||0)+(n||1);}
function crewCost(k){return S.offers[k]||CFG.crew[k].base;}
function checkOffers(){for(const k in CFG.crew){if(S.crew[k]||S.offers[k])continue;const a=CFG.crew[k].after;if((S.stats[a.stat]||0)>=a.n||(a.or&&(S.stats[a.or.stat]||0)>=a.or.n)){
    if(k==='logi'&&liveCount()<2)continue;if(k==='trader'&&!S.lv.trade)continue;
    S.offers[k]=Math.max(CFG.crew[k].base,Math.round(incomeRate()*120/10)*10);S.seen.crew=1;R.newOffer=k;save();return;}}}
function geologist(dt){if(!S.crew.geo||!S.ug)return;R.geoT=(R.geoT||0)+dt;if(R.geoT<2)return;R.geoT=0;if(R.route)return;
  // dry jacks first, then thin ones; each jack gets the best fresh pocket it can actually reach
  const order=[...Array(Math.min(4,d.wells)).keys()].filter(k=>{const l=linkOf(k);return l&&pocketById(l.pocket).left/pocketById(l.pocket).size<=.25;}).sort((a,b)=>(slotDry(b)?1:0)-(slotDry(a)?1:0));
  if(!order.length)return;
  for(const k of order){let best=null,bestPath=null,bv=0;
    for(const p of S.ug.pockets){if(!p.found||p.linked>=0||p.s>S.lv.drill||(p.lease==='east'&&!S.lease.east)||p.left/p.size<.3)continue;
      const path=autoRoute(k,p.id);if(!path)continue;const v=CFG.drill.rich[p.s]*p.left/Math.max(1,routeCost(path,p));if(v>bv){bv=v;best=p;bestPath=path;}}
    if(!best)continue;const c=routeCost(bestPath,best);if(S.cash<c)return;
    R.route={slot:k,cells:bestPath,target:best.id,auto:true};confirmRoute(true);R.geoWarn=0;
    floatText(slotWellX(k),-190,'Geologist re-piped','#9FE3D9',16);R.geoWalk={k,t:0};return;}
  // nobody could be served: look for new pockets, or say it's time to drill deeper
  const hid=S.ug.pockets.filter(p=>!p.found&&p.s<=S.lv.drill&&(p.lease==='home'||S.lease.east));
  if(hid.length){const h=hid[Math.floor(Math.random()*hid.length)];h.found=true;R.pings.push({x:cellX(h.c)+20,y:cellY(h.r),r:CFG.scanR[S.lv.drill],t:0});return;}
  if(!R.geoWarn){R.geoWarn=1;floatText(slotWellX(order[0]),-200,'Geologist: no fresh pockets. Drill deeper.','#FF8A70',15);}}
function logistics(dt){if(!S.crew.logi||!S.autoAlloc)return;R.logiT=(R.logiT||0)+dt;if(R.logiT<2)return;R.logiT=0;
  // weight each live buyer by how much it can take at full price, nudged towards the better payers
  CFG.buyers.forEach((b,i)=>{if(eligible(i,S.lv,d.grade)){return;}const room=Math.max(.15,1-R.buy[i].F/capOf(i));S.w[i]=Math.max(5,Math.min(100,Math.round(b.dem*b.prem*room*4)));});
  d=derive();computeBn();}
function updCrew(dt){const c=S.crew;geologist(dt);logistics(dt);if(Math.floor(R.t)!==Math.floor(R.t-dt))checkOffers();
  if(c.rough&&S.lv.motor){R.roughT+=dt;if(R.roughT>1.4){R.roughT=0;if(R.ev&&R.ev.type==='gusher')capTap(true);else R.psi=Math.min(CFG.psi.max,R.psi+CFG.psi.perTap*.8);}}
  if(c.eng&&R.ev&&R.ev.type==='break'){R.ev.engT=(R.ev.engT||0)+dt;if(R.ev.engT>6)repaired(true);}
  // guardrail: no event may cost more than a few minutes, so an ignored breakdown gets patched up by the site crew
  if(R.ev&&R.ev.type==='break'&&R.ev.t>75){repaired(true);}
  if(S.lv.trade){const auto=S.lv.trade>=CFG.trade.autoAt;
    if(c.trader){if(R.price<R.avg*.97&&!S.holdOn)S.holdOn=true;if(R.price>R.avg*1.1&&S.hold>d.holdCap*.25){sellHold(true);S.holdOn=false;}}
    else if(auto&&S.hold>0&&R.price>=CFG.price*(1+S.thr))sellHold(true);}}
function hire(k){const c=CFG.crew[k],cost=crewCost(k);if(S.crew[k]||!S.offers[k]||S.cash<cost){sfx.fail();return false;}S.cash-=cost;S.crew[k]=1;if(R.newOffer===k)R.newOffer=null;
  d=derive();computeBn();sfx.buy();vibe(12);const P={rough:[wellheadX()+40,-40],disp:[GEO.termX-70,-40],eng:[GEO.sepCX-60,-30],trader:[1655,-40],geo:[wellheadX()+80,-40],logi:[1560,-40]}[k];
  ring(P[0],P[1]);floatText(P[0],P[1]-60,c.name+' hired','#FFE08A',20);
  tutEvent('buy','crew_'+k);save();refreshUI(true);return true;}

/* ---------------- events ---------------- */
function evEligible(){return R.devEvents||(S.sessions>=2&&S.built.yard&&S.flags.buyers);}   // never during the first session
function evWeights(){const w={gusher:S.lv.motor?3:0,storm:S.built.yard?2:0,spike:S.lv.trade?2:0,break:S.lv.motor?3*Math.pow(.85,S.lv.maint):0,inspect:1.5};return w;}
function pickEvent(){const w=evWeights();let tot=0;for(const k in w)tot+=w[k];let r=Math.random()*tot;for(const k in w){r-=w[k];if(r<=0)return k;}return 'storm';}
const BREAK={well:{name:'Prime Mover gearbox',pos:()=>[GEO.wellX+175,-40]},plant:{name:'Separator feed pump',pos:()=>[GEO.pitX1+26,-14]},yard:{name:'Loading gantry',pos:()=>[GEO.bay0+34,-60]}};
function startEvent(type){if(R.ev)return;const E={type,t:0};const say=(w,t)=>sayRaw(w,t,{evk:type});
  if(type==='gusher'){E.dur=15;E.taps=0;E.need=12;R.shake=1;say('yara',S.flags.ev_gusher?"Gusher! Tap the well to cap it.":"Gusher on the main well! It's throwing oil everywhere. Tap the well fast to cap it before it runs dry.");}
  else if(type==='storm'){E.dur=60;say('yara',S.flags.ev_storm?"Sandstorm. Trucks at half speed.":"Sandstorm coming in. Trucks crawl at half speed for a minute. Nothing to tap, just ride it out.");}
  else if(type==='spike'){E.dur=30;say('khalid',S.flags.ev_spike?"Price spike. Sell what you are holding.":"The market has panicked. The price is up hard for half a minute. If you have been holding, this is the moment.");}
  else if(type==='break'){const opts=['yard'];if(S.built.plant)opts.push('plant');if(S.lv.motor)opts.push('well');const st=opts[Math.floor(Math.random()*opts.length)];
    E.st=st;E.name=BREAK[st].name;E.dur=Infinity;E.taps=0;E.need=repairNeed();R.shake=.6;
    say('yara',`The ${E.name.toLowerCase()} just seized. That station's dead until it's fixed. Tap it ${E.need} times.`);if(R.tab!==st&&!T.id)setTab(st);}
  else if(type==='inspect'){E.dur=CFG.events.warn+14;E.phase='warn';say('khalid',S.flags.ev_inspect?"An inspector is on the way. Keep the sand clean.":"An inspector is coming. They check your licence against how much you have spilled. Keep the sand clean for the next minute.");}
  S.flags['ev_'+type]=1;R.ev=E;computeBn();sfx.alarm();}
function endEvent(){const E=R.ev;R.ev=null;R.evNext=R.t+CFG.events.gap[0]+Math.random()*(CFG.events.gap[1]-CFG.events.gap[0]);computeBn();
  if(E&&E.type==='gusher'&&!E.capped){const fine=Math.min(S.cash*.03,R.chain*unitAvg()*60);S.cash-=fine;R.shownTarget-=fine;
    floatText(GEO.wellX,-260,'Fine −'+money(fine),'#FF8A70',22);say('yara',"She ran herself out. We lost the oil and the ministry sent a bill. Cap it faster next time.");}}
function capTap(auto){const E=R.ev;if(!E||E.type!=='gusher'||E.capped)return;E.taps++;R.jackPunch=1;if(!auto)vibe(10);
  if(E.taps>=E.need){E.capped=true;const bonus=R.chain*unitAvg()*20;payout(bonus,GEO.wellX,-220,false,'Capped +');say('yara',"Capped. Kept the pressure, lost nothing. Good hands.");endEvent();}}
function repaired(auto){if(!auto)stat('fix');const E=R.ev;if(!E||E.type!=='break')return;const p=BREAK[E.st].pos();ring(p[0],p[1]);burst(p[0],p[1],'#FFE08A',8);floatText(p[0],p[1]-50,auto?(S.crew.eng?'Fixed by engineer':'Patched'):'Fixed!','#9FE3D9',20);sfx.buy();endEvent();}
function inspectResult(){const spilled=R.spillLog.slice(-120).reduce((a,b)=>a+b,0),made=Math.max(1,R.chain*120),frac=spilled/made,allow=.02+.03*S.lv.licence;
  const inc=R.chain*unitAvg();
  if(frac<=allow){const bonus=inc*60*(1+.25*S.lv.licence);payout(bonus,700,-140,false,'Passed +');say('khalid',"The inspector found nothing. That is worth something to the ministry, and so to me.");}
  else{const fine=Math.min(S.cash*.08*(1-.15*S.lv.licence),inc*180);S.cash-=fine;R.shownTarget-=fine;floatText(700,-180,'Fine −'+money(fine),'#FF8A70',24);
    say('khalid',`Inspection failed. Too much oil on the sand for licence ${S.lv.licence}. Clean it up, or buy a better licence.`);}}
function updEvents(dt){if(!R.ev){if(evEligible()&&!T.id&&S.lv.motor&&R.t>R.evNext)startEvent(pickEvent());return;}
  const E=R.ev;E.t+=dt;
  if(E.type==='gusher'){if(Math.random()<dt*10)part({type:'drop',x:wellheadX()+(Math.random()-.5)*30,y:-120-Math.random()*80,vx:(Math.random()-.5)*120,vy:-60+Math.random()*60,r:3+Math.random()*4,g:420,life:3,col:oilCol()});}
  if(E.type==='inspect'){if(E.phase==='warn'&&E.t>=CFG.events.warn){E.phase='visit';R.car={x:480,v:0,state:'in',t:0};}
    if(E.phase==='visit'&&R.car){const c=R.car;if(c.state==='in'){c.x+=dt*120;if(c.x>=780){c.state='stop';c.t=0;sfx.door();}}
      else if(c.state==='stop'){c.t+=dt;if(c.t>3){c.state='out';inspectResult();sfx.door();}}else{c.x-=dt*160;if(c.x<460){R.car=null;endEvent();}}}
    return;}
  if(E.t>=E.dur)endEvent();}

/* ---------------- land ---------------- */
function mark(k){S.mk[k]={life:S.life,buys:S.buys};}
function earned(k){return S.mk[k]?S.life-S.mk[k].life:-1;}
function buysSince(k){return S.mk[k]?S.buys-S.mk[k].buys:-1;}
function landTargets(st){const L=CFG.land[st],out=[];for(const id in L.need)out.push({label:TNAME[id]+' Lv '+L.need[id],have:S.lv[id],want:L.need[id],ok:S.lv[id]>=L.need[id]});
  const e=Math.max(0,earned(L.from));out.push({label:'Earn '+money(L.earn),have:e,want:L.earn,ok:e>=L.earn,money:true});return out;}
function landReady(st){return S.mk[CFG.land[st].from]&&landTargets(st).every(t=>t.ok);}
function landCost(st){return CFG.land[st].cost;}
function buyLand(st){if(S.built[st]||S.cash<landCost(st)){sfx.fail();return false;}const c=landCost(st);S.cash-=c;R.shownTarget-=c;S.built[st]=1;mark(st);mark('reveal');S.offer=null;
  if(st==='plant'){S.seen.sep=1;S.pit=0;S.rack=Math.min(S.rack,CFG.pickup.rackB);}
  if(st==='yard'){S.seen.tank=1;S.seen.fleet=1;S.tank=Math.min(S.rack,30);S.rack=0;const P=R.pickup;R.pickup=null;R.oldPickup=P?{x:P.x,dir:1,t:0}:null;
    d=derive();for(let i=0;i<d.trucks;i++)addTruck(slotX(i,d.trucks)-600-i*60,'back');}
  R.build={st,t:0};d=derive();computeBn();R.punch=1;R.shake=.5;sfx.strata();vibe([20,40,20]);
  const P=st==='plant'?[GEO.sepCX-40,-60]:[1000,-60];for(let i=0;i<40;i++)part({type:'dust',x:P[0]+(Math.random()-.5)*320,y:-4-Math.random()*60,vx:(Math.random()-.5)*120,vy:-30-Math.random()*60,r:8+Math.random()*10,grow:22,life:1.6,col:'#F3D9A8'});
  floatText(P[0],P[1]-120,(st==='plant'?'Plant':'Yard')+' built!','#FFE08A',28);
  tutEvent('buy','land_'+st);save();if(typeof buildPanel==='function')buildPanel();return true;}

function buy(id,n){let k=0;while(k<n){if(maxed(id))break;const c=cost(id);if(S.cash<c)break;S.cash-=c;R.shownTarget-=c;S.lv[id]++;k++;}

  const P={wells:[GEO.wellX+100,-120],road:[1150,-10],beam:[GEO.wellX,-150],motor:[GEO.wellX+175,-40],drill:[wellheadX(),-40],sep:[GEO.sepCX,-70],desal:[GEO.sepCX-60,-110],maint:[GEO.sepCX+60,-110],

  floatText(P[0],P[1]-50,k>1?`+${k} levels`:'Lv '+S.lv[id],'#FFE08A',22);

  const beforeRoad=roadName(S.lv.road-k);if(id==='road'&&roadName(S.lv.road)!==beforeRoad){floatText(1150,-120,roadName(S.lv.road)+'!','#FFE08A',24);for(let i=0;i<24;i++)part({type:'dust',x:560+Math.random()*1100,y:0,vx:(Math.random()-.5)*40,vy:-20-Math.random()*30,r:6+Math.random()*6,grow:16,life:1.1,col:'#F3D9A8'});}
  if(id==='wells'){const w=d.wells;floatText(w<=4?[0,355,62,480][w-1]:GEO.wellX,-230,w<=4?'New pumpjack!':'On the horizon!','#FFE08A',22);R.punch=1;}
  if(id==='drill')celebrateStratum();
  if(id==='wells'&&d.wells<=4){S.ug.links[d.wells-1]=S.ug.links[d.wells-1]||null;}
  if(id==='contracts'){const b=CFG.buyers[S.lv.contracts];R.punch=1;floatText(1310,-150,b.name+' signed','#FFE08A',20);}
  if((id==='drill'||id==='desal'||id==='licence')&&Math.round(d.grade)!==Math.round(oldGrade))floatText(GEO.sepCX,-160,'Grade '+Math.round(d.grade),'#9FE3D9',20);
  if(id==='trade'&&S.lv.trade===k)S.holdOn=false;
  S.buys+=k;if(S.lv.motor&&!S.mk.motor)mark('motor');
  tutEvent('buy',id);save();refreshUI(true);return k;}

/* ---------------- world taps ---------------- */
function tapJack(){R.jackPunch=1;vibe(6);tutEvent('tapJack');
  if(R.ev&&R.ev.type==='gusher'){capTap(false);sfx.tap(1.6);return;}
  if(S.lv.motor===0){if(R.strokeQ<CFG.manualQ)R.strokeQ++;sfx.tap(1);S.flags.taps=(S.flags.taps||0)+1;}
  else{R.psi=Math.min(CFG.psi.max,R.psi+CFG.psi.perTap);sfx.tap(R.psi/100);stat('surge');
    if(R.tr-R.lastPsiFloat>.3){R.lastPsiFloat=R.tr;floatText(wellheadX()+30,-104,Math.round(R.psi)+' psi','#FFF3DC',15);}}
  const wx=wellheadX();for(let i=0;i<3;i++)part({type:'dust',x:wx+(Math.random()-.5)*30,y:-3,vx:(Math.random()-.5)*60,vy:-15-Math.random()*25,r:5,grow:14,life:.6,col:'#F3D9A8'});}
function worldTap(sx,sy){const w=s2w(sx,sy),zs=1/Math.sqrt(cam.z);
  // broken equipment first
  if(R.ev&&R.ev.type==='break'){const p=BREAK[R.ev.st].pos();if(Math.abs(w.x-p[0])<80*zs&&Math.abs(w.y-p[1])<80*zs){R.ev.taps++;R.shake=.25;sfx.clank();burst(p[0],p[1],'#FFE08A',4);
    floatText(p[0],p[1]-40,R.ev.taps+'/'+R.ev.need,'#FFF3DC',18);if(R.ev.taps>=R.ev.need)repaired(false);return;}}
  if(S.lv.trade&&S.hold>0&&Math.abs(w.x-1472)<40*zs&&w.y<-60&&w.y>-200){sellHold(false);return;}
  const P=R.pickup;if(P&&(P.state==='unload'||P.state==='out')&&P.load>0&&Math.abs(w.x-P.x)<60*zs&&Math.abs(w.y+22)<50*zs){sellPickup(true);P.state='back';tutEvent('tapTruck');return;}
  let best=null,bd=1e9;
  for(const t of R.trucks)if((t.state==='out'||t.state==='unload')&&t.load>0&&t.qi<2){const dx=Math.abs(w.x-t.x),dy=Math.abs(w.y-(t.y-24));
    if(dx<62*zs&&dy<52*zs&&dx<bd){bd=dx;best=t;}}
  if(best){const before=best.load;stat('truckTap');sell(best,true);if(best.load<=1e-6)best.state='back';else floatText(best.x,-90,'Buyers full','#FF8A70',16);if(best.load<before)tutEvent('tapTruck');return;}
  if(S.ug&&S.seen.ug&&!T.id&&slotDry(0)&&Math.abs(w.x-(GEO.wellX-40))<150*zs&&w.y<0&&w.y>-260){R.seg.well='ug';if(R.tab!=='well')setTab('well');startRoute(0);buildPanel();return;}
  if(S.ug&&S.seen.ug&&!T.id){for(let k=1;k<Math.min(4,d.wells);k++){if(linkOf(k)&&!slotDry(k))continue;const j=JSPOTS[k-1];if(Math.abs(w.x-(j.x-30*j.s))<90*j.s*zs&&w.y<0&&w.y>j.y-190*j.s){R.seg.well='ug';if(R.tab!=='well')setTab('well');startRoute(k);buildPanel();return;}}}
  const s=1+Math.min(S.lv.beam,10)*0.025;
  if(w.x>GEO.wellX-175*s&&w.x<GEO.wellX+260*s&&w.y>-250*s-30&&w.y<50)tapJack();}

/* ---------------- offline earnings ---------------- */
function computeOffline(){if(!S.lastSeen||!S.lv.motor)return null;const gap=(Date.now()-S.lastSeen)/1000;if(gap<90)return null;
  const secs=Math.min(gap,CFG.offline.maxH*3600),cap=d.tankCap*CFG.offline.capMul+d.holdCap;
  let bbl=R.chain*secs*CFG.offline.eff;const capped=bbl>cap;bbl=Math.min(bbl,cap);
  let unit=0,tw=0;CFG.buyers.forEach((b,i)=>{if(live(i)){unit+=S.w[i]*b.prem;tw+=S.w[i];}});unit=tw?unit/tw:1;
  const v=bbl*CFG.price*unit*gradeMult()*d.mul*.9;return {gap,secs,bbl,capped,v};}
/* ---------------- fx primitives ---------------- */

function floatText(x,y,text,col,size){R.floats.push({x,y,text,col,size:size||18,t:0,life:1.15});if(R.floats.length>30)R.floats.shift();}
function ring(x,y){part({type:'ring',x,y,r:10,grow:170,life:.45,col:'#FFE08A'});}
function burst(x,y,col,n){for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,s=60+Math.random()*120;part({type:'spark',x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-60,g:300,r:3+Math.random()*2,life:.6,col});}}
function splat(x,y,r){for(let i=0;i<3;i++)part({type:'drop',x,y:y-1,vx:(Math.random()-.5)*70,vy:-30-Math.random()*40,r:Math.max(1.4,r*.4),g:420,life:.8,col:BIT,nostain:true,land:y});}
function stain(x,y){for(const s of R.stains)if(Math.abs(s.x-x)<24&&Math.abs(s.y-y)<8){s.rx=Math.min(58,s.rx+1.1);s.ry=Math.min(12,s.ry+.22);s.a=Math.min(.92,s.a+.05);return;}
  R.stains.push({x,y,rx:8,ry:3,a:.6,col:oilCol()});if(R.stains.length>44)R.stains.shift();}
function spawnCoins(sx,sy,val,streak){const n=val>0?Math.max(3,Math.min(10,3+Math.floor(Math.log10(val+1)*2))):8;
  sx=Math.max(14,Math.min(W-14,sx));sy=Math.max(R.hudBottom+10,Math.min(R.panelTop-10,sy));
  for(let i=0;i<n;i++)R.coins.push({x0:sx+(Math.random()-.5)*26,y0:sy+(Math.random()-.5)*16,side:(Math.random()-.5)*120,t:-i*.045,dur:.55+Math.random()*.25,v:val/n,first:i===0,streak,spin:Math.random()*6});}
function w2s(x,y){return {x:W/2+(x-cam.x)*K,y:GY+y*K};}
function s2w(x,y){return {x:(x-W/2)/K+cam.x,y:(y-GY)/K};}
function vibe(p){try{navigator.vibrate&&navigator.vibrate(p);}catch(e){}}

/* ---------------- audio: the site should sound like a working place ---------------- */
const AU={ctx:null,on:true,master:null,eng:null,wind:null,hum:null,diesel:null};
function auInit(){if(AU.ctx)return;try{const A=window.AudioContext||window.webkitAudioContext,c=new A();AU.ctx=c;AU.master=c.createGain();
  AU.master.gain.value=AU.on?.55:0;AU.master.connect(c.destination);
  const osc=(type,f)=>{const o=c.createOscillator();o.type=type;o.frequency.value=f;o.start();return o;};
  const gain=v=>{const g=c.createGain();g.gain.value=v;return g;};
  // engine bed: pitch and filter track strokes per minute and PSI
  {const o1=osc('sawtooth',40),o2=osc('square',20),f=c.createBiquadFilter(),g=gain(0),g2=gain(.35);f.type='lowpass';f.frequency.value=220;f.Q.value=3;
   o1.connect(f);o2.connect(g2).connect(f);f.connect(g).connect(AU.master);AU.eng={o1,o2,f,g};}
  // desert wind: looped filtered noise
  {const len=c.sampleRate*2,b=c.createBuffer(1,len,c.sampleRate),dt=b.getChannelData(0);let l=0;for(let i=0;i<len;i++){l=l*.97+(Math.random()*2-1)*.03;dt[i]=l*6;}
   const s=c.createBufferSource();s.buffer=b;s.loop=true;const f=c.createBiquadFilter();f.type='bandpass';f.frequency.value=520;f.Q.value=.7;const g=gain(0);s.connect(f).connect(g).connect(AU.master);s.start();AU.wind={f,g};}
  // separator hum
  {const o1=osc('sine',98),o2=osc('triangle',196),g=gain(0),g2=gain(.3);o1.connect(g);o2.connect(g2).connect(g);g.connect(AU.master);AU.hum={g};}
  // truck diesel + gravel
  {const o=osc('sawtooth',46),f=c.createBiquadFilter(),g=gain(0);f.type='lowpass';f.frequency.value=240;o.connect(f).connect(g).connect(AU.master);AU.diesel={o,g};}
 }catch(e){}}
function tone(fq,dur,o){if(!AU.ctx||!AU.on)return;o=o||{};const c=AU.ctx,t=c.currentTime+(o.delay||0),os=c.createOscillator(),g=c.createGain();
  os.type=o.type||'sine';os.frequency.setValueAtTime(fq,t);if(o.slide)os.frequency.exponentialRampToValueAtTime(Math.max(20,fq*o.slide),t+dur);
  g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(o.vol||.2,t+(o.att||.005));g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  os.connect(g).connect(AU.master);os.start(t);os.stop(t+dur+.03);}
const sfx={
  coin(s){const f=880*Math.pow(2,s/12);tone(f,.17,{type:'triangle',vol:.2});tone(f*1.5,.24,{type:'sine',vol:.12,delay:.035});},
  tick(){tone(1900+Math.random()*400,.035,{type:'square',vol:.018});},
  tap(p){tone(150*Math.min(2,.8+p*.3),.13,{type:'sine',vol:.32,slide:.5});},
  thud(v){tone(68,.2,{type:'sine',vol:.28*(v||1),slide:.6});},
  creak(){tone(260+Math.random()*40,.16,{type:'triangle',vol:.025,slide:1.25});},
  buy(){[523,659,784,1046].forEach((f,i)=>tone(f,.16,{type:'triangle',vol:.15,delay:i*.055}));},
  fail(){tone(170,.14,{type:'square',vol:.05,slide:.7});},
  card(w){w==='khalid'?(tone(140,.22,{type:'sine',vol:.12,slide:.85}),tone(110,.18,{type:'sine',vol:.06,delay:.12})):tone(330,.14,{type:'triangle',vol:.08,slide:1.2});},
  gloop(){tone(90+Math.random()*30,.14,{type:'sine',vol:.08,slide:.55});},
  alarm(){tone(620,.22,{type:'square',vol:.07});tone(470,.3,{type:'square',vol:.06,delay:.2});},
  door(){tone(180,.08,{type:'square',vol:.08,slide:.5});tone(120,.1,{type:'sine',vol:.1,delay:.07});[0,1,2].forEach(i=>tone(90,.05,{type:'sine',vol:.05,delay:.3+i*.28}));},
  clank(){tone(420+Math.random()*200,.06,{type:'square',vol:.07,slide:.6});tone(1400,.04,{type:'triangle',vol:.04});},
  strata(){[392,523,659,784,1046].forEach((f,i)=>tone(f,.28,{type:'triangle',vol:.14,delay:i*.08}));},
  ping(){tone(1320,.5,{type:'sine',vol:.12,slide:.5});tone(660,.7,{type:'sine',vol:.06,delay:.12,slide:.7});},
  blast(){tone(70,.35,{type:'sawtooth',vol:.2,slide:.4});tone(180,.12,{type:'square',vol:.1,slide:.3,delay:.02});},
  gavel(){tone(160,.12,{type:'square',vol:.12,slide:.5});tone(90,.25,{type:'sine',vol:.2,delay:.05});}
};
function prox(x){return Math.max(0,1-Math.abs(cam.x-x)/650);}
function updAudio(){if(!AU.ctx)return;const t=AU.ctx.currentTime,on=AU.on?1:0;
  const f=Math.min(170,30+d.spm*.9*Math.sqrt(R.psi/100));AU.eng.o1.frequency.setTargetAtTime(f,t,.1);AU.eng.o2.frequency.setTargetAtTime(f/2,t,.1);
  AU.eng.f.frequency.setTargetAtTime(180+(R.psi-100)*5,t,.1);AU.eng.g.gain.setTargetAtTime(S.lv.motor?on*.05*Math.max(.12,prox(FOCUS.well))*(1+Math.min(1,(d.wells-1)*.2)):0,t,.2);
  AU.wind.g.gain.setTargetAtTime(on*(.018+.012*Math.sin(R.tr*.23)*Math.sin(R.tr*.61)),t,.5);AU.wind.f.frequency.setTargetAtTime(460+Math.sin(R.tr*.3)*120,t,.5);
  AU.hum.g.gain.setTargetAtTime(on*(R.plantActive?.035:0)*Math.max(.08,prox(GEO.sepCX)),t,.3);
  const moving=R.trucks.filter(k=>Math.abs(k.v)>10).length;AU.diesel.o.frequency.setTargetAtTime(44+Math.min(moving,6)*2,t,.3);

function drawPriceLine(){const c=$('pline');if(!c)return;const r=c.getBoundingClientRect();if(!r.width)return;const dp=DPR;
  if(c.width!==Math.round(r.width*dp)){c.width=Math.round(r.width*dp);c.height=Math.round(r.height*dp);}
  const g=c.getContext('2d');g.setTransform(dp,0,0,dp,0,0);const w=r.width,h=r.height;g.clearRect(0,0,w,h);
  const hs=R.hist.concat([R.price]);let lo=Infinity,hi=-Infinity;for(const v of hs){lo=Math.min(lo,v);hi=Math.max(hi,v);}
  const pad=Math.max(.06,(hi-lo)*.15);lo-=pad;hi+=pad;const Y=v=>h-4-(h-8)*(v-lo)/(hi-lo),X=i=>4+(w-8)*i/180;
  g.strokeStyle='rgba(255,243,220,.25)';g.setLineDash([4,4]);g.lineWidth=1.5;g.beginPath();g.moveTo(0,Y(R.avg));g.lineTo(w,Y(R.avg));g.stroke();g.setLineDash([]);
  if(S.lv.trade>=CFG.trade.autoAt&&!S.crew.trader){const ty=Y(CFG.price*(1+S.thr));g.strokeStyle='rgba(242,178,51,.8)';g.beginPath();g.moveTo(0,ty);g.lineTo(w,ty);g.stroke();}
  const off=180-hs.length+1;const grd=g.createLinearGradient(0,0,0,h);grd.addColorStop(0,'rgba(92,205,195,.35)');grd.addColorStop(1,'rgba(92,205,195,0)');
  g.beginPath();hs.forEach((v,i)=>{const x=X(i+off),y=Y(v);i?g.lineTo(x,y):g.moveTo(x,y);});g.lineTo(X(180),h);g.lineTo(X(off),h);g.closePath();g.fillStyle=grd;g.fill();
  g.beginPath();hs.forEach((v,i)=>{const x=X(i+off),y=Y(v);i?g.lineTo(x,y):g.moveTo(x,y);});g.strokeStyle='#1A120E';g.lineWidth=5;g.lineJoin='round';g.stroke();g.strokeStyle='#5CCDC3';g.lineWidth=2.5;g.stroke();
  const ly=Y(R.price);g.beginPath();g.arc(X(180),ly,4.5+Math.sin(R.tr*6),0,7);g.fillStyle='#F2B233';g.fill();g.lineWidth=2;g.strokeStyle='#1A120E';g.stroke();}

function endHold(e){const h=R.hold;if(!h)return;R.hold=null;h.b.classList.remove('down');if(e&&e.type==='pointercancel')return;h.b.classList.remove('squash');void h.b.offsetWidth;h.b.classList.add('squash');
  if(h.id){if(h.stage===0)buy(h.id,1);}
  else if(h.b.id==='bGas'){releaseGas();}
  else if(h.b.id.startsWith('bPipe')){R.routePan=0;startRoute(+h.b.id.slice(5));buildPanel();tutEvent('startRoute');}
  else if(h.b.id==='bRtUndo'){if(R.route&&R.route.cells.length>1){R.route.cells.pop();R.route.target=null;}}
  else if(h.b.id==='bRtCancel'){R.route=null;buildPanel();}
  else if(h.b.id==='bRouteOk'){if(confirmRoute())buildPanel();}
  else if(h.b.dataset.land){if(buyLand(h.b.dataset.land))R.tab=h.b.dataset.land;}
  else if(h.crew)hire(h.crew);
  else if(h.b.id==='bHold'){S.holdOn=!S.holdOn;sfx.tick();tutEvent('hold');}
  else if(h.b.id==='bSell'){sellHold(false);tutEvent('sell');}
  else if(h.b.id==='bSound'){AU.on=!AU.on;if(AU.master)AU.master.gain.value=AU.on?.55:0;}
  else if(h.b.id==='bSpeed'){R.speed=R.speed===1?3:R.speed===3?10:1;}
  else if(h.b.id==='bTut'){for(const k of ['plant','yard','gate','split','tradeUse'])delete S.flags['tut_'+k];save();floatText(cam.x,-200,'Tips reset','#9FE3D9',20);}
  else if(h.b.id==='bReset'){if(R.resetArm>R.tr)wipe();else R.resetArm=R.tr+2.5;}
  refreshUI();}
